#jbMealV14{--mg:#087c70;--mb:#d9e8e2}
#jbMealV14 .meal-mode{display:flex;gap:7px;margin:10px 0 16px}
#jbMealV14 .meal-mode button{flex:1;border:1px solid var(--mb);background:#f4f8f6;color:#234a41;border-radius:9px;padding:12px 5px}
#jbMealV14 .meal-mode button.sel{background:var(--mg);color:#fff}
#jbMealV14 .meal-formbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:12px 0}
#jbMealV14 .meal-formbar label{min-width:130px;flex:1}
#jbMealV14 .meal-formbar input,#jbMealV14 .meal-formbar select{width:100%;max-width:260px;min-height:42px}
#jbMealV14 .meal-toolbar{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
#jbMealV14 .meal-toolbar button{padding:10px 12px;min-height:42px}
#jbMealV14 .meal-list{width:100%;border-collapse:collapse}
#jbMealV14 .meal-list th,#jbMealV14 .meal-list td{font-size:13px;border-bottom:1px solid var(--mb);padding:9px 4px;text-align:left}
#jbMealV14 .meal-list th:nth-child(2),#jbMealV14 .meal-list td:nth-child(2){text-align:center}
#jbMealV14 .meal-list select{width:100%;min-width:0;padding:8px 3px}
#jbMealV14 .meal-list input[type=checkbox]{width:20px;height:20px}
#jbMealV14 .meal-panel{border:1px solid var(--mb);border-radius:12px;padding:14px;margin:12px 0}
#jbMealV14 .meal-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:10px 0}
#jbMealV14 .meal-stats div{background:#eaf6f1;border-radius:9px;padding:12px}
#jbMealV14 .meal-stats strong{font-size:20px}
#jbMealV14 .meal-monthbar{display:flex;justify-content:space-between;align-items:center;gap:9px;margin:12px 0}
#jbMealV14 .meal-monthbar button{min-width:45px;min-height:42px}
#jbMealV14 .meal-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
#jbMealV14 .meal-week{text-align:center;font-size:12px;color:#688278;padding:5px 0}
#jbMealV14 .meal-day{min-width:0;min-height:61px;background:#fff;border:1px solid #dbe8e3;border-radius:8px;padding:5px 2px;text-align:center;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;color:#224a42}
#jbMealV14 .meal-day.has{background:#edf8f2}
#jbMealV14 .meal-day.active{border:2px solid #087c70;background:#d8f1e7}
#jbMealV14 .meal-day small{font-size:10px;line-height:1.25}
#jbMealV14 .meal-guest-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
#jbMealV14 .meal-guest-grid label input,#jbMealV14 .meal-guest-grid label select{width:100%;min-height:41px}
@media(max-width:430px){#jbMealV14 .meal-calendar{gap:3px}#jbMealV14 .meal-day{min-height:52px;padding:3px 0}#jbMealV14 .meal-day small{font-size:9px}#jbMealV14 .meal-list th,#jbMealV14 .meal-list td{font-size:12px}}
</style><style>

function archiveRangeChange(){archiveUi.from=document.getElementById('archiveFrom')?.value||'';archiveUi.to=document.getElementById('archiveTo')?.value||'';if(archiveUi.from&&archiveUi.to&&archiveUi.from>archiveUi.to){alert('종료일은 시작일 이후로 설정해 주세요.');return;}archiveUi.day='';archiveUi.page=1;filterArchive();}

function archiveRows(){const q=archiveUi.search.toLowerCase().trim();return archivedTasks().filter(t=>{const d=archiveDate(t);if(!d)return false;const day=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;return (!archiveUi.from||day>=archiveUi.from)&&(!archiveUi.to||day<=archiveUi.to)&&(!archiveUi.day||day===archiveUi.day)&&(archiveUi.dept==='all'||emp(t.owner).dept===archiveUi.dept)&&(t.title+' '+emp(t.owner).name).toLowerCase().includes(q);}).sort((a,b)=>completedStamp(b)-completedStamp(a));}
function archiveCalendar(){const y=archiveUi.year,m=archiveUi.month,first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();const days=Array.from({length:last},(_,i)=>i+1);const counts={};archivedTasks().forEach(t=>{const d=archiveDate(t);if(d&&d.getFullYear()===y&&d.getMonth()===m){const n=d.getDate();counts[n]=(counts[n]||0)+1;}});return `<div class="archive-calendar"><div class="flex between archive-calendar-head"><button class="btn soft" onclick="archiveMonthShift(-1)" aria-label="이전 달">◀</button><b>${y}년 ${m+1}월</b><button class="btn soft" onclick="archiveMonthShift(1)" aria-label="다음 달">▶</button></div><div class="archive-calendar-grid">${['일','월','화','수','목','금','토'].map(w=>`<span class="archive-week">${w}</span>`).join('')}${Array.from({length:first},()=>'<span></span>').join('')}${days.map(d=>{const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;return `<button class="archive-day ${archiveUi.day===ds?'picked':''} ${counts[d]?'with-items':''}" onclick="archiveDaySelect('${ds}')" title="${d}일: 완료 업무 ${counts[d]||0}건"><strong>${d}</strong>${counts[d]?`<small>${counts[d]}건</small>`:''}</button>`}).join('')}</div><div class="tiny muted">날짜를 누르면 해당 날짜의 완료 업무만 조회합니다. 다시 누르면 날짜 선택이 해제됩니다.</div></div>`;}
function archivePage(){return section('완료 업무 보관함',`<p class="info">완료 후 7일간 일반 목록에 표시한 뒤 보관합니다. 업무·사진·댓글·누적 진행/보류 시간은 삭제되지 않습니다.</p><div id="archiveCalendar"></div><div class="grid2"><div class="field"><label>완료일 시작</label><input id="archiveFrom" type="date" value="${archiveUi.from}" onchange="archiveRangeChange()"></div><div class="field"><label>완료일 종료</label><input id="archiveTo" type="date" value="${archiveUi.to}" onchange="archiveRangeChange()"></div></div><div class="flex wrap" style="margin:8px 0">${btn('전체 기간 보기','archiveRangeClear()','soft')}<span class="tiny muted">날짜 선택 또는 기간 지정으로 조회 · 기본값 오늘</span></div><div class="grid2"><div class="field"><label>팀·부서 선택</label><select id="archiveDept" onchange="archiveFilterChange()"><option value="all">전체 팀</option>${departments.map(d=>`<option value="${esc(d)}" ${archiveUi.dept===d?'selected':''}>${esc(d)}</option>`).join('')}</select></div><div class="field"><label>담당자·업무 제목 검색</label><input id="archiveSearch" placeholder="담당자 또는 업무 제목" value="${esc(archiveUi.search)}" oninput="archiveFilterChange()"></div></div><div class="flex between wrap" style="margin:12px 0"><b id="archiveCount"></b></div><div id="archiveItems"></div><div id="archivePagination"></div><p class="tiny muted">조회 전용 보관함입니다. 목록은 한 페이지에 5건씩 표시됩니다.</p>`);}

function filterArchive(){const list=archiveRows(),max=Math.max(1,Math.ceil(list.length/5));archiveUi.page=Math.min(Math.max(1,archiveUi.page),max);const holder=document.getElementById('archiveItems');if(!holder)return;const cal=document.getElementById('archiveCalendar');if(cal)cal.innerHTML=archiveCalendar();holder.innerHTML=list.slice((archiveUi.page-1)*5,archiveUi.page*5).map(t=>`<div class="card archive-entry"><div class="flex between wrap"><div><b>${esc(t.title)}</b><div class="tiny muted">${esc(emp(t.owner).dept)} · ${esc(emp(t.owner).name)} · 완료 ${archiveDate(t).toLocaleDateString('ko-KR')} · 진행 ${fmtElapsed(clockTotal(t,'진행중'))} / 보류 ${fmtElapsed(clockTotal(t,'일시중단'))}</div></div>${btn('상세 확인',`detail('${t.id}')`,'soft')}</div></div>`).join('')||'<p class="muted">조건에 맞는 보관 업무가 없습니다.</p>';const count=document.getElementById('archiveCount');if(count)count.textContent='검색 결과 '+list.length+'건';const pg=document.getElementById('archivePagination');if(pg)pg.innerHTML=`<div class="flex between wrap" style="align-items:center;justify-content:center;margin:15px 0;gap:12px"><button class="btn soft" ${archiveUi.page===1?'disabled':''} onclick="archiveGoPage(${archiveUi.page-1})">이전</button><span>${archiveUi.page} / ${max} 페이지</span><button class="btn soft" ${archiveUi.page===max?'disabled':''} onclick="archiveGoPage(${archiveUi.page+1})">다음</button></div>`;}
function clockInit(t){if(t.clock&&typeof t.clock==='object')return;const now=Date.now();t.clock={totals:{'예정':0,'진행중':0,'일시중단':0,'완료':0},since:now,history:[{at:new Date(now).toISOString(),from:null,to:t.status,reason:'시간 기록 시작 (이전 기록 소급 불가)'}]};}
function clockTotal(t,kind,now=Date.now()){const c=t.clock;if(!c)return 0;return Math.max(0,Number(c.totals?.[kind]||0)+((t.status===kind&&(kind==='진행중'||kind==='일시중단'))?Math.max(0,now-Number(c.since||now)):0));}
function fmtElapsed(ms){const sec=Math.floor(Math.max(0,ms)/1000);const hh=Math.floor(sec/3600),mm=Math.floor(sec%3600/60),ss=sec%60;return [hh,mm,ss].map(v=>String(v).padStart(2,'0')).join(':');}
function taskClockPanel(t){clockInit(t);const c=t.clock;return `<div class="task-clock-panel"><div class="flex between wrap"><b>⏱ 상태별 누적 시간</b><span class="pill ${esc(t.status)}">현재 ${esc(t.status==='일시중단'?'보류':t.status)}</span></div><div class="tiny muted">상태를 변경한 시각부터 자동 기록됩니다. 상태를 전환해도 이전 누적 시간은 유지됩니다.</div><div class="task-clock-grid"><div class="task-clock-box ${t.status==='진행중'?'active':''}"><span class="tiny">🟦 진행중</span><b data-clock-task="${esc(t.id)}" data-clock-kind="진행중">${fmtElapsed(clockTotal(t,'진행중'))}</b></div><div class="task-clock-box ${t.status==='일시중단'?'active':''}"><span class="tiny">🟨 보류중</span><b data-clock-task="${esc(t.id)}" data-clock-kind="일시중단">${fmtElapsed(clockTotal(t,'일시중단'))}</b></div></div><div class="task-clock-history"><b>상태 변경 이력</b>${[...(c.history||[])].slice(-15).reverse().map(h=>`<div>${esc(new Date(h.at).toLocaleString('ko-KR'))} · ${esc(h.from||'기록 시작')} → <b>${esc(h.to==='일시중단'?'보류':h.to)}</b></div>`).join('')}</div></div>`;}
function updateClockLabels(){document.querySelectorAll('[data-clock-task]').forEach(el=>{const t=db.tasks.find(x=>x.id===el.dataset.clockTask);if(t)el.textContent=fmtElapsed(clockTotal(t,el.dataset.clockKind))});}

let _clocksMigrated=false;
function migrateClocks(){if(_clocksMigrated)return;_clocksMigrated=true;let changed=false;for(const t of db.tasks){if(!t.clock){clockInit(t);changed=true;}if(t.status==='완료'&&!t.completedAt&&!t.archiveReferenceAt){const prior=[...(t.clock?.history||[])].reverse().find(h=>h.to==='완료'&&h.from!==null);t[prior?'completedAt':'archiveReferenceAt']=prior?Date.parse(prior.at):Date.now();changed=true;}}if(changed)save();}

eaderButton.style.display=ui.role==='manager'?'':'none';const alarmCount=$('alarmCount');if(alarmCount)alarmCount.textContent=pendingAlerts().filter(x=>x.kind!=='승인'&&!seenStore()[x.id]).length;applyHomeLayout();jbDrawMobileNav();if(ui.page==='archive')filterArchive();}

  }).join(''):'<p class="muted">등록된 직원이 없습니다.</p>';
  return `<p class="muted tiny">부서를 선택하면 아래에 직원 명단이 펼쳐집니다. 직원 이름을 누르면 업무가 표시됩니다.</p>${tabs}<div class="dept-expanded-panel"><div class="flex between"><b>${esc(selected)} · 직원 ${ps.length}명</b><button type="button" class="soft" onclick="selectHomeDepartment(${JSON.stringify(selected).replace(/&/g,'&amp;').replace(/"/g,'&quot;')})">접기 ⌃</button></div>${list}</div>`;

function phoneCall(id){const p=emp(id);if(!p.phone){alert(`${p.name}: 전화번호가 등록되지 않았습니다.\n데모에는 실제 직원 전화번호를 넣지 않았습니다.`);return}location.href='tel:'+p.phone}function commentPrompt(id){let s=prompt('업무 댓글 / 지시사항을 입력하세요.');if(!s||!s.trim())return;let t=db.tasks.find(t=>t.id===id);t.comments.push({by:ui.role==='ceo'?'대표님':ui.role==='manager'?emp(mine()).name:'직원',text:s.trim(),at:new Date().toLocaleString('ko-KR')});save();render()}

function detailPage(){let t=db.tasks.find(x=>x.id===ui.detail);if(!t)return section('업무 상세','목록에서 업무를 선택해 주세요.');let editable=canChangeTaskStatus(t);return `<div class="toolbar"><h1>업무 상세</h1>${btn('← 목록으로',"ui.page='home';render()")}</div>`+section(esc(t.title),`<div class="flex between">${statusTag(t.status)}<span class="tiny muted">${esc(emp(t.owner).name)} · 목표일 ${esc(t.due||'미설정')}</span></div><p>${esc(t.body)}</p><h3>최초 업무 사진 (${(t.photos||[]).length}장)</h3>${photoMarkup(t.photos||[])}${taskClockPanel(t)}${editable?`<div class="field"><label>업무 상태 변경</label><select onchange="updateStatus('${t.id}',this.value)">${['예정','진행중','일시중단','완료'].map(x=>`<option value="${x}" ${t.status===x?'selected':''}>${x==='일시중단'?'보류':x}</option>`).join('')}</select></div><hr class="hr"><h3>진행 기록 추가</h3><div class="field"><label>진행 내용</label><textarea id="progressNote" placeholder="예: 분갈이 500주 완료"></textarea></div><div class="field"><label>진행 사진 추가 (여러 장)</label><input type="file" id="progressFiles" accept="image/*" multiple onchange="readPics(this,'update')"><button type="button" onclick="jbOpenCamera(this, 'progressFiles')">📷 사진 바로 찍기</button></div><div id="updatePreview" class="filepics"></div>${btn('진행 기록 저장',`saveProgress('${t.id}')`,'green')}`:''}<hr class="hr"><h3>진행 기록 (${t.updates.length}건)</h3>${t.updates.map(u=>`<div class="card"><div class="tiny muted">${esc(u.at)}</div><p>${esc(u.text)}</p>${photoMarkup(u.photos||[])}</div>`).join('')||'<p class="muted tiny">아직 진행 기록이 없습니다.</p>'}<hr class="hr"><h3>댓글 (${t.comments.length}건)</h3>${t.comments.map(c=>`<div class="card"><b>${esc(c.by)}</b> <span class="tiny muted">${esc(c.at)}</span><p>${esc(c.text)}</p></div>`).join('')||'<p class="muted tiny">등록된 댓글이 없습니다.</p>'}${btn('+ 댓글 달기',`commentPrompt('${t.id}')`,'soft')}`)}function photoMarkup(ps){return ps.length?`<div class="filepics">${ps.map(p=>`<a href="${p}" target="_blank" rel="noopener"><img src="${p}" alt="업무 첨부 사진"></a>`).join('')}</div>`:'<p class="tiny muted">첨부된 사진이 없습니다.</p>'}const CLOCK_STATUSES=['예정','진행중','일시중단','완료'];
function updateStatus(id,v){const t=db.tasks.find(x=>x.id===id);if(!t||!CLOCK_STATUSES.includes(v))return;clockInit(t);if(t.status===v)return;const now=Date.now(),old=t.status;const c=t.clock; if(old==='진행중'||old==='일시중단')t.clock.totals[old]=(t.clock.totals[old]||0)+Math.max(0,now-t.clock.since);t.clock.since=now;t.clock.history.push({at:new Date(now).toISOString(),from:old,to:v});t.status=v;if(v==='완료'){t.completedAt=now;delete t.archiveReferenceAt;}else if(old==='완료'){delete t.completedAt;delete t.archiveReferenceAt;}save();render()}
function register(){if(ui.role==='ceo')return section('권한 안내','대표님은 업무 조회 및 댓글 작성 중심입니다. 관리자나 직원 역할에서 직접 업무를 등록할 수 있습니다.');return section('새 업무 등록 · '+roleTitle(),`<form onsubmit="submitTask(event)"><div class="field"><label>반복 업무 선택 (선택사항)</label><select id="templateSelect" onchange="applyTaskTemplate(this.value)"><option value="">직접 입력</option>${db.templates.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')}</select><div class="tiny muted">선택하면 아래 제목에 반영됩니다. 내용을 추가·수정하고 등록하세요.</div></div><div class="field"><label>업무 제목 *</label><input id="newTitle" required placeholder="예: 목수국 분갈이"></div><div class="field"><label>업무 내용</label><textarea id="newBody" placeholder="작업 내용, 계획, 특이사항"></textarea></div><div class="grid2"><div class="field"><label>업무 상태</label><select id="newStatus">${opt(['예정','진행중','일시중단','완료'],'예정')}</select></div><div class="field"><label>목표일</label><input id="newDue" type="date" value="${localDate()}"></div></div><div class="field"><label>현장 사진 첨부 (여러 장)</label><input type="file" accept="image/*" multiple id="newPhotos" onchange="readPics(this,'new')"><button type="button" onclick="jbOpenCamera(this, 'newPhotos')">📷 사진 바로 찍기</button><div class="tiny muted">PC는 파일 선택, 모바일은 앨범/촬영 선택이 가능합니다(기기별로 다름).</div><div id="newPreview" class="filepics"></div></div><button class="btn green full" type="submit">업무 등록</button></form>`)}
function applyTaskTemplate(title){const el=$('newTitle');if(!el)return;if(title)el.value=title;}
function readPics(input,which){let files=Array.from(input.files||[]).slice(0,6);if(!files.length)return;Promise.all(files.map(file=>new Promise(resolve=>{if(!file.type.startsWith('image/'))return resolve(null);let r=new FileReader;r.onload=()=>{const img=new Image;img.onload=()=>{const c=document.createElement('canvas'),sc=Math.min(1,1000/Math.max(img.width,img.height));c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.65))};img.onerror=()=>resolve(null);img.src=r.result};r.onerror=()=>resolve(null);r.readAsDataURL(file)}))).then(arr=>{ui[which==='new'?'photoNew':'photoUpdate']=arr.filter(Boolean);$(which==='new'?'newPreview':'updatePreview').innerHTML=photoMarkup(arr.filter(Boolean));})}
function submitTask(ev){ev.preventDefault();let title=$('newTitle').value.trim();if(!title)return;db.tasks.unshift({id:uid(),owner:mine(),title,body:$('newBody').value,status:$('newStatus').value,due:$('newDue').value,photos:[...ui.photoNew],updates:[],comments:[],...($('newStatus').value==='완료'?{completedAt:Date.now()}:{})});clockInit(db.tasks[0]);save();ui.photoNew=[];ui.notice='가상 업무가 등록되었습니다.';ui.page='home';render()}
function saveProgress(id){const text=$('progressNote').value.trim();if(!text&&!ui.photoUpdate.length)return alert('진행 내용 또는 사진을 입력해 주세요.');db.tasks.find(t=>t.id===id).updates.unshift({text,photos:[...ui.photoUpdate],at:new Date().toLocaleString('ko-KR')});save();ui.photoUpdate=[];render()}

function ensureRosters(){

  // 사용자가 해당 날짜를 이미 수정한 경우에는 절대로 덮어쓰지 않습니다.

 return `<div class="flex between wrap"><b>오늘 주요 일정 · ${events.length}건</b>${btn('전체 일정 보기',"ui.page='schedule';ui.day=relativeDate(0);render()",'soft')}</div>${events.map(e=>`<div class="tiny" style="margin:9px 0">• ${esc(e.title)}</div>`).join('')||'<div class="tiny muted" style="margin-top:9px">오늘 등록된 주요 일정이 없습니다.</div>'}${ui.role!=='staff'?`<div style="margin-top:8px">${btn('+ 일정 등록',"ui.page='schedule';ui.scheduleTab='events';ui.eventEdit='new';render()",'soft')}</div>`:''}`;
}function schedule(){const rosterBlock=ui.role==='staff'?rosterDateLine(ui.day,'선택 날짜 인원배치'):rosterEditor();const registeredRoster=rosterView(ui.day);const ps=employees.filter(p=>p.active!==false&&(ui.who==='전체'||p.dept===ui.who));const off=ps.filter(p=>actualOff(p.id,ui.day)),work=ps.filter(p=>!actualOff(p.id,ui.day)),overtime=ps.filter(p=>isOT(p.id,ui.day));return section('주요 일정 및 휴무 <span class="pill">전 직원 동일 조회</span>',`<div class="grid2"><div class="field"><label>조회 날짜</label><input type="date" value="${ui.day}" onchange="ui.day=this.value;render()"></div><div class="field"><label>조회 부서</label><select onchange="ui.who=this.value;render()">${opt(['전체',...departments],ui.who)}</select></div></div>${rosterBlock}<div class="grid3"><div class="stat"><strong>${registeredRoster?registeredRoster.total:work.length}</strong>${registeredRoster?'배치 근무':'근무 예정'}</div><div class="stat"><strong>${registeredRoster?registeredRoster.leave.length:off.length}</strong>휴무</div><div class="stat"><strong>${overtime.length}</strong>연장근무</div></div><div class="attendance-summary"><b>팀별 인원 · ${esc(ui.day)}</b>${registeredRoster?`<div class="tiny muted">근무 장소별 인원 · 아래 상세 명단 확인</div>`:workTeamSummary(ui.day)}<div class="tiny muted">배치 등록 날짜는 입력 명단을 우선 표시하며, 승인된 휴무를 제외해 집계합니다.</div></div>${ui.scheduleTab==='events'?eventEditor():''}<div class="tabset" style="margin:12px 0">${[['attendance','근무·휴무'],['events','주요 일정'],['ot','연장근무']].map(([v,n])=>btn(n,`ui.scheduleTab='${v}';render()`,ui.scheduleTab===v?'green':'')).join('')}</div>${ui.scheduleTab==='attendance'&&registeredRoster?`<div class="card"><h3>📋 ${esc(ui.day)} 인원배치 상세</h3>${rosterInlineDetails(ui.day)}</div>`:ui.scheduleTab==='attendance'?`<div class="tabset" style="margin-bottom:11px">${btn(`근무자 ${work.length}명`,"ui.attendance='work';render()",ui.attendance==='work'?'green':'')}${btn(`휴무자 ${off.length}명`,"ui.attendance='off';render()",ui.attendance==='off'?'green':'')}</div>${departments.filter(d=>ui.who==='전체'||ui.who===d).map(d=>{const dep=ps.filter(p=>p.dept===d),view=dep.filter(p=>ui.attendance==='off'?actualOff(p.id,ui.day):!actualOff(p.id,ui.day));return `<details open><summary>${esc(d)} <span class="tiny muted">근무 ${dep.filter(p=>!actualOff(p.id,ui.day)).length}명 · 휴무 ${dep.filter(p=>actualOff(p.id,ui.day)).length}명</span></summary><div class="personlist" style="margin-top:10px">${view.map(p=>`<div class="employee"><b>${esc(p.name)}</b><div class="muted tiny">${esc(p.rank)}</div>${statusTag(ui.attendance==='off'?'휴무':'근무')}</div>`).join('')||'<div class="muted tiny">해당 인원이 없습니다.</div>'}</div></details>`}).join('')}`:ui.scheduleTab==='events'?db.events.filter(e=>eventStart(e)<=ui.day&&eventEnd(e)>=ui.day&&(ui.who==='전체'||e.dept==='전체'||e.dept===ui.who)).map(e=>`<div class="event"><div class="flex between wrap"><b>${esc(e.name)}</b>${ui.role!=='staff'?`<span class="flex">${btn('수정',`editEvent('${esc(e.id)}')`,'soft')}${btn('삭제',`deleteEvent('${esc(e.id)}')`,'danger')}</span>`:''}</div><div class="tiny muted">${esc(e.dept)} · ${esc(eventStart(e))}${eventEnd(e)!==eventStart(e)?' ~ '+esc(eventEnd(e)):''}</div><div class="tiny muted">${esc(e.detail)}</div></div>`).join('')||'<p class="muted">선택한 날짜에 등록된 일정이 없습니다.</p>':overtime.map(p=>`<div class="card"><b>${esc(p.name)} · ${esc(p.rank)}</b><div class="muted tiny">${esc(p.dept)} · ${esc(db.requests.find(r=>r.owner===p.id&&r.kind==='연장근무'&&r.status==='승인'&&r.start===ui.day)?.from||'')}~${esc(db.requests.find(r=>r.owner===p.id&&r.kind==='연장근무'&&r.status==='승인'&&r.start===ui.day)?.to||'')}</div></div>`).join('')||'<p class="muted">선택한 날짜에 승인된 연장근무가 없습니다.</p>'}<p class="tiny muted">실제 출퇴근 체크가 아닌, 날짜별 입력 배치표 또는 승인된 휴무 기준 예정 인원입니다. 관리자 및 직원도 동일한 명단을 조회합니다.</p>`)}
function requests(){let my=db.requests.filter(r=>r.owner===mine()),incoming=db.requests.filter(r=>canApprove(r));let form=ui.role==='ceo'?'':`<div class="tabset" style="margin-bottom:12px">${btn('휴무 신청',"ui.formType='휴무';render()",ui.formType==='휴무'?'green':'')}${btn('연장근무 신청',"ui.formType='연장근무';render()",ui.formType==='연장근무'?'green':'')}</div><form onsubmit="submitRequest(event)">${ui.formType==='휴무'?`<div class="field"><label>휴무 구분</label><select id="leaveKind">${opt(['연차','오전 반차','오후 반차','기타 휴무'],'연차')}</select></div><div class="grid2"><div class="field"><label>휴무 시작일 *</label><input id="leaveStart" type="date" required value="${relativeDate(0)}"></div><div class="field"><label>휴무 종료일 *</label><input id="leaveEnd" type="date" required value="${relativeDate(0)}"></div></div>`:`<div class="field"><label>연장근무 날짜 *</label><input id="otDate" type="date" value="${relativeDate(0)}" required></div><div class="grid2"><div class="field"><label>시작 시간 *</label><input id="otFrom" type="time" value="18:00" required></div><div class="field"><label>종료 시간 *</label><input id="otTo" type="time" value="20:00" required></div></div><div class="info">입력한 시작·종료 시간으로 예상 시간을 계산합니다. 자정을 넘기는 연장근무는 V1.0에서 지원하지 않습니다.</div>`}<div class="field" style="margin-top:12px"><label>신청 사유 *</label><textarea id="requestReason" required placeholder="휴무 또는 연장근무 사유"></textarea></div><div class="info" style="margin-bottom:12px">결재자: <b>${ui.role==='manager'?'대표님':'소속 관리자'}</b> · 본인 신청 자체 승인 불가</div><button type="submit" class="btn green full">승인 요청 등록</button></form>`;return section('근무관리 · 휴무·연장근무',form)+section(ui.role==='ceo'?'관리자 신청 승인':'내 신청 내역',ui.role==='ceo'?'<div class="muted tiny">관리자의 휴무·연장근무 승인 요청만 표시됩니다.</div>':my.map(requestRow).join('')||'<p class="muted">신청 내역이 없습니다.</p>')+(ui.role!=='staff'?section(ui.role==='ceo'?'관리자 신청 관리':'소속 직원 신청 승인',incoming.map(r=>requestRow(r,true)).join('')||'<p class="muted">승인 대기 및 처리 기록이 없습니다.</p>'):'')}
function requestRow(r,approval=false){let body=r.kind==='휴무'?`${esc(r.subkind)} · ${esc(r.start)} ~ ${esc(r.end)}`:`${esc(r.start)} · ${esc(r.from)}~${esc(r.to)}`;return `<div class="card"><div class="flex between"><b>${esc(emp(r.owner).name)} · ${esc(r.kind)}</b>${statusTag(r.status)}</div><div class="tiny muted">${body}</div><p>${esc(r.reason)}</p>${approval&&r.status==='대기'?`<div class="flex wrap">${btn('승인',`setApproval('${r.id}','승인')`,'green')}${btn('반려',`setApproval('${r.id}','반려')`,'danger')}</div>`:''}</div>`}
function submitRequest(ev){ev.preventDefault();let kind=ui.formType,r={id:uid(),owner:mine(),kind,reason:$('requestReason').value.trim(),status:'대기'};if(!r.reason)return; if(kind==='휴무'){r.subkind=$('leaveKind').value;r.start=$('leaveStart').value;r.end=$('leaveEnd').value;if(!r.start||!r.end||r.end<r.start)return alert('종료일은 시작일 이후로 선택해 주세요.');if(r.subkind.includes('반차')&&r.start!==r.end)return alert('반차는 같은 날짜를 선택해 주세요.')}else{r.start=$('otDate').value;r.from=$('otFrom').value;r.to=$('otTo').value;if(!r.start||!r.from||!r.to||r.to<=r.from)return alert('종료 시간은 시작 시간보다 늦어야 합니다.')}db.requests.unshift(r);save();ui.notice='신청이 접수되었습니다. 시연용 승인 대기 상태입니다.';render()}
function setApproval(id,state){let r=db.requests.find(x=>x.id===id);if(!r||!canApprove(r)||r.status!=='대기')return alert('승인 권한이 없습니다.');r.status=state;save();ui.notice=`${esc(emp(r.owner).name)}의 신청을 ${state} 처리했습니다.`;render()}
const mealPlaces=Array.isArray(db.mealPlaces)&&db.mealPlaces.length?db.mealPlaces:['본사','동이','조경사업부(쇼가든)','특수장소(현장)'];
function ensureMealDay(){
 const today=localDate(new Date());
 if(!Array.isArray(db.mealOrderHistory))db.mealOrderHistory=[];
 if(!db.mealDate){
   // 구버전 주문에는 신뢰할 수 있는 날짜가 없으므로 오늘 주문으로 간주하지 않음
   for(const [place,o] of Object.entries(db.mealOrders||{}))db.mealOrderHistory.unshift({date:'날짜 미확인',place,at:o.at||'',by:o.by||'',count:o.members?o.members.split('|').filter(Boolean).length:0,legacy:true});
   db.mealOrders={};db.mealDate=today;save();return;
 }
 if(db.mealDate!==today){
   // 확정된 주문은 completeMealFor에서 이미 기록. 다음 날짜의 식사는 다시 확인
   db.mealDate=today;db.meal={};db.mealOrders={};db.mealTeamConfirm={};save();
 }
}
function mealOrderDate(o){return o?.date||'날짜 미확인'}
function mealOrderStamp(place){const o=db.mealOrders[place];return o?`<div class="meal-stamp">🕒 ${esc(mealOrderDate(o))} ${esc(o.time||o.at||'')} · ${esc(o.by||'')} · ${o.members?o.members.split('|').filter(Boolean).length:0}명</div>`:'<div class="tiny muted" style="margin-top:6px">오늘 주문 기록 없음</div>'}
function mealHistoryPanel(){const rows=(db.mealOrderHistory||[]).slice().reverse().slice(0,35);return `<div class="card"><h3>최근 식사 주문 기록</h3><div class="tiny muted">주문 확정할 때마다 날짜·시간·장소·인원·확정자를 보관합니다. 최근 35건 표시</div><div class="meal-history">${rows.map(h=>`<div class="meal-history-row"><b>${esc(h.date||'날짜 미확인')} ${esc(h.time||h.at||'')}</b> · ${esc(h.place)} · ${h.count||0}명<br><span class="muted">${esc(h.by||'')} ${h.legacy?'· 이전 버전 날짜 미확인':''}</span></div>`).join('')||'<div class="tiny muted">확정된 주문 기록이 없습니다.</div>'}</div></div>`}
function mealMembers(place){return Object.entries(db.meal).filter(([,v])=>v===place).map(([id])=>id).sort()}
function mealOrderState(place){const o=db.mealOrders[place];return !o?'주문 전':o.members===mealMembers(place).join('|')?'주문 완료':'인원 재확인'}
function meals(){ensureMealDay();const ps=peopleIn(ui.mealDept), total=Object.keys(db.meal).filter(k=>db.meal[k]).length;
const cards=`<div class="grid2 meal-summary">${mealPlaces.map((place,i)=>{const n=mealMembers(place).length,st=mealOrderState(place);return `<div class="meal-summary-card"><div class="meal-title">${['🏢','🚚','🌳','📍'][i]} ${esc(place==='조경사업부(쇼가든)'?'쇼가든':place==='특수장소(현장)'?'특수장소':place)}</div><div class="meal-num">${n}<span>명</span></div>${statusTag(st)}<button class="btn soft full" style="margin-top:11px" onclick='ui.mealPlace=${JSON.stringify(place)};render();document.getElementById("meal-order-area").scrollIntoView({behavior:"smooth",block:"start"})'>주문 확인 ↓</button></div>`}).join('')}</div>`;
const head=`<div class="flex between wrap" style="margin-bottom:12px"><b>${mealPlaces.length}개 장소 식사 인원</b><span class="counter">전체 ${total}명</span></div>${cards}<p class="tiny muted">각 장소의 인원과 주문 상태를 한 화면에서 동시에 확인합니다. 직원별로 식사 장소는 한 곳만 지정됩니다.</p>`;
const checks=`<hr class="hr"><h3>부서별 식사 인원 체크 · 팀 전체 일괄 입력</h3><div class="field"><label>부서 선택</label><select onchange="ui.mealDept=this.value;render()">${opt(departments,ui.mealDept)}</select></div><div class="flex between"><b>${esc(ui.mealDept)} · 식사 ${ps.filter(p=>db.meal[p.id]).length}/${ps.length}명</b><span class="tiny muted">개인 수정 · 팀 담당자 일괄 입력 모두 가능</span></div><div class="card" style="background:#f2faf5"><b>팀 담당자 빠른 입력</b><p class="tiny muted">해당 부서의 식사 여부를 한 명이 모두 체크할 수 있습니다. 누구나 이용 가능하며 개인별로 다시 변경할 수도 있습니다.</p><div class="grid2"><div class="field"><label>팀 전체 식사 장소</label><select id="teamMealPlace">${opt(mealPlaces,'본사')}</select></div><div class="field"><label>일괄 선택</label><div class="flex wrap">${btn('전체 식사',`setTeamMeal(true)`,'soft')}${btn('전체 미식사',`setTeamMeal(false)`,'soft')}</div></div></div><div class="tiny muted">팀별 인원 확인: ${esc(db.mealTeamConfirm?.[ui.mealDept]?.by||'미확인')} ${esc(db.mealTeamConfirm?.[ui.mealDept]?.at||'')}</div>${btn('이 팀 식사 인원 확인 완료',`confirmTeamMeal()`,'green full')}</div>${ps.map(p=>`<div class="card flex between meal-person"><label class="grow" style="margin:0;cursor:pointer"><input style="width:auto;margin-right:7px" type="checkbox" ${db.meal[p.id]?'checked':''} onchange="mealCheck('${p.id}',this.checked)">${esc(p.name)} <span class="muted tiny">${esc(p.rank)}</span></label>${db.meal[p.id]?`<select aria-label="${esc(p.name)} 식사 장소" style="max-width:165px" onchange="mealLocation('${p.id}',this.value)">${opt(mealPlaces,db.meal[p.id])}</select>`:''}</div>`).join('')}`;
const orders=`<div id="meal-order-area"><hr class="hr"><h3>장소별 주문 관리 <span class="pill">${mealPlaces.length}곳 모두 표시</span></h3>${mealPlaces.map(place=>{const memberIds=mealMembers(place),st=mealOrderState(place),o=db.mealOrders[place];return `<div class="card meal-order-card"><div class="flex between wrap"><div><b>${esc(place==='조경사업부(쇼가든)'?'쇼가든':place==='특수장소(현장)'?'특수장소':place)}</b> <strong>${memberIds.length}명</strong></div>${statusTag(st)}</div>${mealOrderStamp(place)}<details style="margin-top:9px"><summary>식사 명단 보기</summary><div class="tiny muted" style="margin-top:8px">${memberIds.map(id=>esc(emp(id).name)).join(', ')||'등록된 식사 인원 없음'}</div></details>${o?`<div class="tiny muted">최근 주문: ${esc(o.by)} · ${esc(o.at)} · ${o.members?o.members.split('|').filter(Boolean).length:0}명</div>`:''}${st==='인원 재확인'?'<div class="warn tiny">주문 이후 인원이 변경됐습니다. 실제 식당 주문 수량을 확인하세요.</div>':''}<button class="btn ${st==='주문 완료'?'soft':'green'} full" style="margin-top:10px" ${memberIds.length?'':'disabled'} onclick='completeMealFor(${JSON.stringify(place)})'>${st==='인원 재확인'?'인원 재확인 완료':st==='주문 완료'?'주문 완료 · 다시 확인':'이 장소 주문 완료 처리'}</button></div>`}).join('')}</div>`;
return section('오늘의 식사 주문 <span class="pill">전 직원 공통</span>',`<div class="info">식사 장소는 관리자가 추가·수정할 수 있습니다. 장소별 인원과 주문 현황을 한 화면에서 동시에 확인하세요.</div><div style="margin-top:14px">${head}</div>${mealPlacesEditor()}${checks}${orders}${mealHistoryPanel()}`)}
function mealPlacesEditor(){return `<div class="card" style="margin:12px 0"><div class="flex between wrap"><b>🍽 식사 장소 관리</b>${ui.role==='manager'?btn('+ 장소 추가','addMealPlace()','soft'):''}</div><div class="flex wrap" style="margin-top:8px">${mealPlaces.map((p,i)=>`<span class="compact-team-count">${esc(p)} ${ui.role==='manager'?btn('수정',`renameMealPlace(${i})`,'soft'):''}</span>`).join('')}</div><p class="tiny muted">장소 추가·수정은 관리자 전용입니다. 기존 주문 이력의 당시 장소 이름은 유지됩니다.</p></div>`}
function addMealPlace(){if(ui.role!=='manager')return;let name=prompt('새 식사 장소 이름');if(!name||!name.trim())return;name=name.trim();if(mealPlaces.includes(name))return alert('이미 등록된 장소입니다.');mealPlaces.push(name);db.mealPlaces=[...mealPlaces];save();render()}
function renameMealPlace(i){if(ui.role!=='manager')return;const old=mealPlaces[i];let name=prompt('변경할 식사 장소 이름',old);if(!name||!name.trim())return;name=name.trim();if(name!==old&&mealPlaces.includes(name))return alert('이미 등록된 장소입니다.');mealPlaces[i]=name;db.mealPlaces=[...mealPlaces];Object.keys(db.meal||{}).forEach(k=>{if(db.meal[k]===old)db.meal[k]=name});if(db.mealOrders?.[old]){db.mealOrders[name]=db.mealOrders[old];delete db.mealOrders[old]}save();render()}
function mealEditor(){return ui.role==='ceo'?'대표님':emp(mine()).name||'사용자'}
function ensureMealMeta(){if(!db.mealTeamConfirm)db.mealTeamConfirm={};if(!Array.isArray(db.mealEditHistory))db.mealEditHistory=[];}
function logMealEdit(ids,action){ensureMealMeta();db.mealEditHistory.unshift({at:new Date().toLocaleString('ko-KR'),by:mealEditor(),dept:ui.mealDept,action,count:ids.length});db.mealEditHistory=db.mealEditHistory.slice(0,150);delete db.mealTeamConfirm[ui.mealDept];}
function setTeamMeal(on){const members=peopleIn(ui.mealDept),p=document.getElementById('teamMealPlace')?.value||'본사';if(on&&!mealPlaces.includes(p))return;for(const x of members){if(on)db.meal[x.id]=p;else delete db.meal[x.id];}logMealEdit(members.map(x=>x.id),on?'전체 식사 '+p:'전체 미식사');save();render();}

 class="autocomplete" style="display:none"></div><div class="tiny muted" id="selectedPlant">선택한 품목: ${esc(ui.plant||'없음')}</div></div><div class="grid2"><div class="field"><label>규격</label><select id="moveSpec">${opt(specs,'C2')}</select></div><div class="field"><label>수량 (주)</label><input id="moveQty" type="number" min="1" step="1" placeholder="예: 200"></div></div>${btn('+ 이동 목록에 추가',`addMoveItem()`,'soft')}<h3 style="margin-top:17px">이동 등록 목록 (${ui.moveCart.length}품목)</h3>${ui.moveCart.length?`<table><thead><tr><th>품목명</th><th>규격</th><th class="right">수량</th><th></th></tr></thead><tbody>${ui.moveCart.map((x,i)=>`<tr><td>${esc(x.plant)}</td><td>${esc(x.spec)}</td><td class="right">${x.qty}</td><td><button class="btn danger" onclick="ui.moveCart.splice(${i},1);render()">삭제</button></td></tr>`).join('')}</tbody></table>`:'<p class="muted tiny">추가한 품목이 없습니다.</p>'}<div style="margin-top:15px">${btn('이동 기록 저장',`saveMove()`,'green full')}</div>`)}
function saveMove(){const from=chosenPath('from'),to=chosenPath('to');if(!db.locationPaths.some(p=>locationText(p)===locationText(from))||!db.locationPaths.some(p=>locationText(p)===locationText(to)))return alert('출발지와 도착지의 마지막 위치까지 선택해 주세요.');if(locationText(from)===locationText(to))return alert('출발 위치와 도착 위치는 달라야 합니다.');if(!ui.moveCart.length)return alert('이동할 품목을 먼저 추가해 주세요.');db.moves.unshift({id:uid(),date:days[0],from:locationText(from),to:locationText(to),by:mine(),items:ui.moveCart.map(x=>({...x}))});ui.moveCart=[];ui.moveDate=days[0];save();ui.notice='이동 기록 1건(여러 품목 묶음)을 저장했습니다.';render()}

 return section('👥 직원·부서 관리',`

 ${departments.map(d=>`<div class="flex between wrap" style="padding:8px 0;border-bottom:1px solid var(--line,#e5e7eb)"><b>${esc(d)}</b><div class="flex"><span class="tiny muted">${employees.filter(p=>p.dept===d&&p.active!==false).length}명</span>${btn('부서명 수정',`renameDepartment('${esc(d).replace(/'/g,'&#39;')}')`,'soft')}</div></div>`).join('')}</div>
 <div class="card"><h3>직원 추가</h3><form onsubmit="addStaff(event)"><div class="grid2">${field('staffName','이름 *')}${field('staffRank','직함 *')}${deptSelect('staffDept',departments[0])}${field('staffPhone','전화번호','','tel')}</div><button class="btn green full" type="submit">+ 직원 추가</button></form></div>
 ${p?`<div class="card" id="staffEditForm"><h3>${esc(p.name)} · 직원 정보 수정</h3><form onsubmit="saveStaffEdit(event)"><div class="grid2">${field('editName','이름 *',p.name)}${field('editRank','직함 *',p.rank)}${deptSelect('editDept',p.dept)}${field('editPhone','전화번호',p.phone||'','tel')}</div><div class="flex"><button type="submit" class="btn green">수정 사항 저장</button>${btn('취소',"ui.staffEdit=null;render()",'soft')}</div></form></div>`:''}
 <h3>전체 직원 명단 (${employees.length}명)</h3><div class="field"><label>부서별 조회</label><select id="staffFilter" onchange="filterStaffCards(this.value)">${opt(['전체',...departments],'전체')}</select></div>

// V1.3 test: registration mail errors and verification are separate from employee approval.
// The public Supabase default mailer has delivery restrictions; the UI must not
// claim that an inbox has received mail merely because signUp() returned 200.
let jbLastSignupMailRequestAt=0;
function jbSignupErrorMessage(error,context='signup'){
 const code=String(error?.code||error?.error_code||'').toLowerCase();
 const status=Number(error?.status||0);
 const raw=String(error?.message||'');
 if(code==='over_email_send_rate_limit'||(status===429&&/email|mail/i.test(raw)))
  return 'Supabase 인증 메일 발송 한도를 초과했습니다. 반복해서 회원가입을 누르지 마세요. 관리자가 사용자용 SMTP를 설정한 뒤 다시 시도해야 합니다.';
 if(code==='email_address_not_authorized')
  return '현재 Supabase 기본 메일 서버는 프로젝트 팀에 등록되지 않은 이메일로 인증 메일을 보낼 수 없습니다. 관리자에게 SMTP 설정을 요청하세요.';
 if(code==='email_not_confirmed')
  return '이메일 인증이 아직 완료되지 않았습니다. 인증 메일의 링크를 확인한 뒤 로그인하세요.';
 if(code==='otp_expired'||code==='otp_disabled'||code==='email_link_invalid')
  return '이메일 인증 링크가 만료되었거나 유효하지 않습니다. 앱에서 인증 메일 재발송을 요청하세요.';
 if(code==='over_request_rate_limit'||status===429)
  return '인증 요청이 너무 많습니다. 반복 요청을 중단하고 잠시 후 다시 시도해 주세요.';
 if(code==='signup_disabled')
  return '이 프로젝트에서는 신규 회원가입이 비활성화되어 있습니다. 관리자에게 문의하세요.';
 return raw||((context==='login')?'로그인 처리에 실패했습니다.':'인증 처리에 실패했습니다.');
}
function jbSignupRedirectUrl(){
 // file:// and localhost cause default Site URL redirects to the wrong address.
 if(location.protocol!=='https:'||!location.host)
  throw new Error('회원가입 및 이메일 인증은 배포된 HTTPS 업무관리 앱 주소에서 진행해 주세요. PC의 HTML 파일이나 localhost 주소에서는 가입하지 마세요.');
 return location.origin+location.pathname;
}
function jbAuthCallbackErrorMessage(){
 try{
  const sources=[new URLSearchParams(location.hash.replace(/^#/,'')),new URLSearchParams(location.search)];
  for(const q of sources){
   const code=q.get('error_code')||q.get('error');
   if(!code)continue;
   return '이메일 인증 처리 실패: '+jbSignupErrorMessage({code,message:q.get('error_description')||''});
  }
 }catch(_){}
 return '';
}

 shell.innerHTML=`<div class="srv-box jb-login-card"><div class="jb-login-content">

 document.getElementById('jbSignupBack').onclick=()=>login();
 document.getElementById('jbSignupSubmit').onclick=async()=>{
  const b=document.getElementById('jbSignupSubmit'),m=document.getElementById('jbSignupMessage');
  const email=document.getElementById('jbSignupEmail').value.trim();
  const password=document.getElementById('jbSignupPassword').value,confirmPassword=document.getElementById('jbSignupConfirm').value;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){m.textContent='올바른 이메일 주소를 입력하세요.';return;}
  if(password.length<8){m.textContent='비밀번호는 최소 8자 이상 입력하세요.';return;}
  if(password!==confirmPassword){m.textContent='비밀번호가 일치하지 않습니다.';return;}
  b.disabled=true;m.textContent='회원가입 처리 중...';
  try{
   const redirect=jbSignupRedirectUrl();
   const {data,error}=await supa.auth.signUp({email,password,options:{emailRedirectTo:redirect}});
   if(error)throw error;
   jbLastSignupMailRequestAt=Date.now();
   // Even with confirmations turned off, membership is granted only via
   // jb_employees auth_user_id server-side linking and role checks.
   if(data?.session)await supa.auth.signOut();
   m.textContent=data?.session
    ?'계정 가입 요청이 처리되었습니다. 이메일 인증 설정은 관리자 확인이 필요하며, 직원 계정 연결 전에는 앱을 사용할 수 없습니다.'
    :'가입 요청이 접수되었습니다. 인증 메일이 도착하면 링크를 눌러 인증해 주세요. 메일 수신이 확인된 것은 아닙니다. 인증 후 관리자에게 직원 계정 연결을 요청하세요.';
   document.getElementById('jbSignupPassword').value='';
   document.getElementById('jbSignupConfirm').value='';
  }catch(e){m.textContent='회원가입 실패: '+jbSignupErrorMessage(e);}
  finally{b.disabled=false;}
 };
 document.getElementById('jbSignupResend').onclick=async()=>{
  const button=document.getElementById('jbSignupResend'),message=document.getElementById('jbSignupMessage');
  const email=document.getElementById('jbSignupEmail').value.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){message.textContent='재발송할 이메일 주소를 입력해 주세요.';return;}
  const seconds=Math.ceil((60000-(Date.now()-jbLastSignupMailRequestAt))/1000);
  if(seconds>0){message.textContent='메일을 방금 요청했습니다. '+seconds+'초 이후에 재발송할 수 있습니다.';return;}
  button.disabled=true;message.textContent='인증 메일 재발송 요청 중...';
  try{
   const redirect=jbSignupRedirectUrl();
   const {error}=await supa.auth.resend({type:'signup',email,options:{emailRedirectTo:redirect}});
   if(error)throw error;
   jbLastSignupMailRequestAt=Date.now();
   message.textContent='인증 메일 재발송 요청이 접수되었습니다. 받은편지함과 스팸함을 확인하세요. 실제 메일 도착은 별도로 확인해야 합니다.';
  }catch(e){message.textContent='재발송 실패: '+jbSignupErrorMessage(e);}
  finally{button.disabled=false;}
 };
}

 profile=data;jbAcctOpen=false;jbAcctState=null;jbAcctMsg='';repeatTemplates=[];repeatTemplatesLoaded=false;await loadData();await loadRepeatTemplates();

// V6.6.8.1: 로그인 후 변경된 재직상태/역할을 서버에서 재확인합니다.

async function jbVerifyCurrentEmployee(){
 if(!supa||!profile)return false;
 const {data:authData,error:authError}=await supa.auth.getUser();
 if(authError||!authData?.user){
  // 모바일 화면 복귀 시 일시적인 네트워크 오류를 로그아웃으로 오인하지 않습니다.
  const {data:sessionData,error:sessionError}=await supa.auth.getSession();
  if(sessionError||sessionData?.session){
   err='연결 상태를 확인 중입니다. 인터넷 연결 후 다시 시도해 주세요.';
   return false;
  }
  profile=null;records={tasks:[],departments:[],employees:[],attendance:[],announcements:[],reads:[],readStats:[],leaves:[],leaveChanges:[],notes:[],managedEmployees:[],taskComments:[],taskHistory:[],events:[]};
  login('인증 세션이 만료되었습니다. 다시 로그인해 주세요.');return false;
 }
 const {data:me,error:empError}=await supa.from('jb_employees')
  .select('id,name,position,app_role,department_id,active')
  .eq('auth_user_id',authData.user.id).maybeSingle();
 if(empError){
  err='직원 권한 확인에 실패했습니다. 다시 시도해 주세요: '+empError.message;
  return false;
 }
 if(!me||me.active!==true){
  profile=null;records={tasks:[],departments:[],employees:[],attendance:[],announcements:[],reads:[],readStats:[],leaves:[],leaveChanges:[],notes:[],managedEmployees:[],taskComments:[],taskHistory:[],events:[]};
  try{await supa.auth.signOut()}catch(_){}
  login('이 계정은 현재 비활성 상태이거나 직원 등록이 해제되어 사용할 수 없습니다.');return false;
 }
 const identityChanged=profile.id!==me.id||profile.app_role!==me.app_role||profile.department_id!==me.department_id;
 profile=me;
 if(identityChanged){
  // 과거 역할에서 불러온 민감한 관리 목록을 먼저 비웁니다.
  records.managedEmployees=[];records.employeeRoles=[];records.leaves=[];
  if(!['owner','manager'].includes(me.app_role)&&['employees'].includes(view))view='home';
 }
 return true;
}
async function jbRecheckOnReturn(){
 if(!profile||busy||jbSessionCheckBusy)return;
 jbSessionCheckBusy=true;
 try{
  const oldRole=profile.app_role,oldDepartment=profile.department_id;
  if(await jbVerifyCurrentEmployee()){
   if(profile.app_role!==oldRole||profile.department_id!==oldDepartment)await loadData();
  }else if(profile){dashboard();}
 }catch(e){err='계정 상태 재확인 오류: '+String(e.message||e);if(profile)dashboard()}
 finally{jbSessionCheckBusy=false;}
}
window.addEventListener('focus',()=>{void jbRecheckOnReturn()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)void jbRecheckOnReturn()});
setInterval(()=>{void jbRecheckOnReturn()},60000);
// V6.6.8.5.1: Home overview is a live projection of server data, not a separate copy.

function jbHomeCanAutoRefresh(){

 const active=document.activeElement;
 if(active&&shell.contains(active)&&active.matches('textarea, input, select, [contenteditable="true"]'))return false;

// V31: 휴무 승인 및 알림 화면도 일정 간격으로 서버에서 새 요청을 읽는다.

async function loadData(){
 // 서버에서 권한이 바뀐 직원이 과거 관리자 화면을 계속 보지 않게 차단
 if(!await jbVerifyCurrentEmployee())return;
 busy=true;err='';dashboard();
 try{
 const requests=[['events',supa.from('jb_events').select('id,title,description,event_date,created_by,created_at').gte('event_date',localDay(-31)).lte('event_date',localDay(365)).order('event_date',{ascending:true}).limit(1000)],['taskHistory',supa.from('jb_task_history').select('id,task_id,previous_status,new_status,changed_at').order('changed_at',{ascending:true}).limit(5000)],['taskComments',supa.from('jb_task_comments').select('id,task_id,author_id,body,created_at').order('created_at',{ascending:true}).limit(1000)],['departments',supa.from('jb_departments').select('id,name').limit(100)],['employees',supa.rpc('jb_public_staff_directory')],['staffPhones',supa.from('jb_staff_contact_numbers').select('employee_id,phone')],...(profile.app_role==='owner'?[['managedEmployees',supa.rpc('jb_admin_staff_management_list')]]:profile.app_role==='manager'?[['managedEmployees',supa.rpc('jb_manager_staff_management_list')]]:[]),['employeeRoles',supa.from('jb_employees').select('id,app_role,department_id').eq('active',true).limit(500)],['attendance',supa.from('jb_attendance').select('id,work_date,status,work_location,temporary_name,employee_id').gte('work_date',localDay(-1)).order('work_date').limit(1000)],['announcements',supa.from('jb_announcements').select('id,title,content,image_paths,author_id,created_at,updated_at').order('created_at',{ascending:false}).limit(30)],['reads',supa.from('jb_announcement_reads').select('announcement_id,employee_id,read_at').limit(1000)],['readStats',supa.rpc('jb_announcement_read_stats')],['notes',supa.from('jb_attendance_notes').select('id,work_date,note,created_at').gte('work_date',localDay(-1)).order('created_at',{ascending:false}).limit(100)],['leaves',supa.rpc('jb_leave_visible_requests')],['leaveChanges',supa.rpc('jb_leave_change_visible')],['reportRequests',supa.from('jb_task_report_requests').select('id,task_id,requester_id,note,created_at,acknowledged_at,acknowledged_by,target_owner').order('created_at',{ascending:false}).limit(1000)],['commentAttention',supa.from('jb_task_comment_attention_v13').select('comment_id,task_id,employee_id,created_at,acknowledged_at').eq('employee_id',profile.id).is('acknowledged_at',null).order('created_at',{ascending:false}).limit(1000)],...(profile.app_role==='staff'?[['taskAssignments',supa.from('jb_task_assignment_ack_v13').select('task_id,employee_id,assigned_at,acknowledged_at').eq('employee_id',profile.id).is('acknowledged_at',null).order('assigned_at',{ascending:false}).limit(1000)]]:[])];
 // V6.6.5.9: 이전 100건 제한 해소. 오래된 업무를 500건씩 순차 조회합니다.
 // 서버 오류가 나면 이미 불러온 업무를 유지하고 누락 가능성을 안내합니다.
 const tasksQuerySize=500,tasksMaximum=5000;
 let tasksBatch=[],tasksLoadError='';
 for(let offset=0;offset<tasksMaximum;offset+=tasksQuerySize){
  const {data,error}=await supa.from('jb_tasks')
    .select('id,title,description,status,assignee_id,department_id,created_by,due_date,created_at,completed_at')
    .order('created_at',{ascending:false}).order('id',{ascending:false})
    .range(offset,offset+tasksQuerySize-1);
  if(error){tasksLoadError='업무 목록 조회가 중단되었습니다 ('+(offset+1)+'번째부터): '+error.message+' · 현재 표시된 업무는 일부이며 서버 새로고침이 필요합니다.';break;}
  const batch=data||[];tasksBatch.push(...batch);
  if(batch.length<tasksQuerySize)break;
 }
 records.tasks=tasksBatch;
 if(tasksLoadError)err+=(err?'\n':'')+tasksLoadError;
 if(tasksBatch.length>=tasksMaximum)err+=(err?'\n':'')+'업무가 5,000건 이상입니다. 일부 오래된 업무는 완료 보관함에서 조회하고, 전체 조회 범위를 확장해야 합니다.';

 for(const r of resp){

    // 특히 승인 신청/직원 역할 정보가 남으면 잘못된 승인 대기 현황이 보일 수 있다.
    records[r.key]=[];
    const labels={leaves:'휴무·연장근무 신청',employeeRoles:'직원 권한',employees:'직원 명단',taskHistory:'업무 상태 이력',taskComments:'업무 댓글',attendance:'근태 인원배치',events:'주요 일정',announcements:'공지사항',managedEmployees:'직원 관리',departments:'부서',reads:'공지 읽음',readStats:'공지 읽음 통계',notes:'근태 메모',staffPhones:'직원 전화번호',reportRequests:'업무 확인 요청',taskAssignments:'신규 업무 지시 확인 요청',commentAttention:'내 업무 새 댓글 확인 요청'};
    const title=labels[r.key]||r.key;
    err+=(err?'\n':'')+title+' 조회 실패: '+r.error.message+' (이전 자료를 표시하지 않았습니다. 서버 새로고침으로 다시 시도하세요.)';

 }

 }else approvedRosterLeaves=rosterResult.data||[];

function canCreate(){return ['owner','manager'].includes(profile?.app_role)}

async function loadRepeatTemplates(){
 if(!profile)return;
 const {data,error}=await supa.from('jb_task_templates').select('id,title,description,created_at').eq('owner_id',profile.id).order('created_at',{ascending:false}).limit(100);

async function saveRepeatTemplate(){

 try{const {error}=await supa.from('jb_task_templates').insert({owner_id:profile.id,title,description});if(error)throw error;await loadRepeatTemplates();const t=shell.querySelector('#srvTaskTitle'),d=shell.querySelector('#srvTaskDescription');if(t)t.value=title;if(d)d.value=description;const m=shell.querySelector('#srvTaskTemplateMsg');if(m)m.textContent='반복 업무 양식을 저장했습니다.';}

async function deleteRepeatTemplate(){

function localDay(offset=0){
 // UTC 시각을 서울 날짜로 바꾸고 날짜만 이동(기기 시간대 무관)
 const fmt=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'});
 const parts=Object.fromEntries(fmt.formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));
 const utc=new Date(Date.UTC(Number(parts.year),Number(parts.month)-1,Number(parts.day)+offset));
 return utc.toISOString().slice(0,10);
}

// 홈이 열린 동안 신규 배정 이력과 업무 상세를 가볍게 동기화한다.
async function jbSyncNewTaskAssignments(){
 if(jbNewTaskPollBusy||!profile||profile.app_role!=='staff'||!supa||busy||view!=='home'||document.hidden||jbNewTaskAckBusy)return;
 const active=document.activeElement;
 if(active&&shell.contains(active)&&active.matches('input,textarea,select,[contenteditable="true"]'))return;
 jbNewTaskPollBusy=true;
 try{
  const {data,error}=await supa.from('jb_task_assignment_ack_v13')
   .select('task_id,employee_id,assigned_at,acknowledged_at')
   .eq('employee_id',profile.id).is('acknowledged_at',null).order('assigned_at',{ascending:false}).limit(1000);
  if(error)throw error;
  const next=data||[];
  const previous=(records.taskAssignments||[]).map(a=>a.task_id+':'+a.assigned_at).sort().join('|');
  const current=next.map(a=>a.task_id+':'+a.assigned_at).sort().join('|');
  const missingIds=next.map(a=>a.task_id).filter(id=>!records.tasks.some(t=>t.id===id));
  if(missingIds.length){
   const res=await supa.from('jb_tasks').select('id,title,description,status,assignee_id,department_id,created_by,due_date,created_at,completed_at').in('id',missingIds.slice(0,200));
   if(res.error)throw res.error;
   records.tasks.push(...(res.data||[]));
  }
  records.taskAssignments=next;
  if(previous!==current||missingIds.length)dashboard();
 }catch(e){console.warn('JB 신규 업무 지시 동기화:',String(e.message||e));}
 finally{jbNewTaskPollBusy=false;}
}
setInterval(()=>{void jbSyncNewTaskAssignments()},20000);

// V1.3: 직원 표시 직함순(권한/DB 저장 순서와 독립적인 화면 정렬).
const jbStaffTitleOrder=['대표','센터장','부장','과장','대리','주임','사원'];
function jbStaffTitleRank(person){
 const position=String(person?.position||person?.rank||'').replace(/\s+/g,'').trim();
 if(position){
  const index=jbStaffTitleOrder.findIndex(title=>position.includes(title));
  if(index>=0)return index;
 }
 // 직함 누락 시에만 owner 계정을 대표로 표시하되, manager를 직함으로 추측하지 않습니다.
 return !position&&person?.app_role==='owner'?0:jbStaffTitleOrder.length;
}
function jbStaffDisplayCompare(a,b){
 const byRank=jbStaffTitleRank(a)-jbStaffTitleRank(b);
 return byRank||String(a?.name||a?.display_name||a?.label||'').localeCompare(String(b?.name||b?.display_name||b?.label||''),'ko');
}
function jbStaffDisplaySorted(people){return [...(people||[])].sort(jbStaffDisplayCompare)}
function jbRosterDisplayCompare(a,b){
 const employeeA=records.employees.find(e=>e.id===a?.employee_id);
 const employeeB=records.employees.find(e=>e.id===b?.employee_id);
 return jbStaffDisplayCompare(employeeA||{name:a?.temporary_name||a?.label||''},
                              employeeB||{name:b?.temporary_name||b?.label||''});
}
// 홈 출근 인원표: 기존 장소 문자열을 바꾸지 않고 표시 순서만 고정합니다.
function jbHomeRosterPlaceRank(place){
 const p=String(place||'').replace(/\s+/g,'');
 if(p==='휴무')return 999;
 if(p==='출장')return 998;
 if(p.includes('농원'))return 0;
 if(p.includes('밭'))return 1;
 if(p.includes('사무실')||p.includes('본사'))return 2;
 if(p.includes('동이'))return 3;
 if(p.includes('쇼가든'))return 4;
 return 100;
}
function jbHomeNameDisplayCompare(a,b){
 const resolve=label=>{
   const text=String(label||'');
   const employee=records.employees.find(e=>text===e.name||text.startsWith(e.name+' ('));
   return employee||{name:text};
 };
 return jbStaffDisplayCompare(resolve(a),resolve(b));
}

async function rosterGet(date){
 const [att,notes,leaves]=await Promise.all([
   supa.from('jb_attendance').select('id,work_date,employee_id,temporary_name,status,work_location,memo').eq('work_date',date).limit(1000),
   supa.from('jb_attendance_notes').select('id,work_date,note,created_at').eq('work_date',date).order('created_at',{ascending:false}).limit(100),
   supa.rpc('jb_approved_leave_roster_v13')
 ]);
 for(const r of [att,notes,leaves])if(r.error)throw new Error(r.error.message);

function rosterFromRows(rows,date){

 const approvedIds=new Set(rosterApplicableLeaves(date).map(l=>l.employee_id));
 const people=rosterPeople().filter(e=>rosterCanEdit()||byId.has(e.id)||approvedIds.has(e.id)).map(e=>{
 const r=byId.get(e.id);return {id:r?.id||null,employee_id:e.id,temporary_name:'',label:e.name+' '+(e.position||''),status:rosterLeaveIds(date).has(e.id)?'off':(rosterHalfCategory(e.id,date)&&r?.status==='off'?'working':(r?.status||'working')),work_location:r?.work_location||records.departments.find(d=>d.id===e.department_id)?.name||'',memo:r?.memo||'',exists:!!r,changed:!!(r&&rosterLeaveIds(date).has(e.id)&&r.status!=='off')};
 });

   .select('id,work_date,employee_id,temporary_name,status,work_location,memo')

  if(error)throw error;

  const previousById=new Map(previousRows.filter(r=>r.employee_id).map(r=>[r.employee_id,r]));

  for(const r of previousTemps){

   if(!name||names.has(name))throw Error('전날 임시 인원에 이름 누락 또는 중복이 있어 복사할 수 없습니다. 전날 배치를 확인하세요: '+(name||'(이름 없음)'));

   if(todayTemps.has(name))throw Error('오늘 저장된 임시 인원 이름이 중복되어 안전하게 복사할 수 없습니다: '+name);

}

 const term=noticeListQuery.trim().toLocaleLowerCase('ko-KR');

 const filtered=sorted.filter(a=>(noticeListMode!=='unread'||!isRead(a))&&(!term||(String(a.title||'')+' '+String(a.content||'')).toLocaleLowerCase('ko-KR').includes(term)));
 const pageSize=6,pages=Math.max(1,Math.ceil(filtered.length/pageSize));noticeListPage=Math.min(Math.max(1,noticeListPage),pages);
 const visible=filtered.slice((noticeListPage-1)*pageSize,noticeListPage*pageSize);
 if(!visible.length)h+='<p class="srv-muted jb-notice-empty">조건에 맞는 공지가 없습니다.</p>';
 for(const a of visible){const read=isRead(a);const stat=records.readStats.find(x=>x.announcement_id===a.id);const countText=stat?'읽음 '+stat.read_count+' / '+stat.total_staff+'명':'읽음 인원 집계 확인 필요';const paths=noticePaths(a);
 h+=`<details class="srv-notice jb-notice-card ${read?'jb-notice-read':'jb-notice-unread'}" data-notice="${safe(a.id)}"><summary><span class="jb-notice-title">${safe(a.title)}</span> <span class="srv-pill">${read?'읽음':'미확인'}</span><div class="srv-muted">${safe((a.created_at||'').slice(0,10))} · ${safe(countText)} · 사진 ${paths.length}장</div></summary><div class="jb-notice-body" style="white-space:pre-wrap">${safe(a.content)}</div><div class="srv-notice-images" data-images="${safe(a.id)}"></div>${noticeCanEdit(a)?`<div class="srv-row"><button class="alt" data-notice-edit="${safe(a.id)}">수정</button><button class="alt" data-notice-delete="${safe(a.id)}">삭제</button></div>`:''}</details>`;
 }
 h+=`<div class="jb-notice-footer"><span>${filtered.length}건 중 ${visible.length?((noticeListPage-1)*pageSize+1):0}~${Math.min(noticeListPage*pageSize,filtered.length)}건 · ${noticeListPage}/${pages}페이지</span><div class="srv-row"><button type="button" class="alt" data-notice-page="-1" ${noticeListPage<=1?'disabled':''}>이전</button><button type="button" class="alt" data-notice-page="1" ${noticeListPage>=pages?'disabled':''}>다음</button></div></div>`;
 return h;
}

async function noticeLoadImages(id){

 const results=await Promise.all(paths.map(async p=>{const r=await supa.storage.from(NOTICE_BUCKET).createSignedUrl(p,600);return r.error?null:r.data?.signedUrl}));
 if(!wrap.isConnected)return;wrap.replaceChildren();const grid=document.createElement('div');grid.className='srv-row';grid.style.cssText='align-items:flex-start;margin-bottom:12px';

async function noticeUpload(id,files){
 const uploaded=[];
 for(const f of files){const ext=f.type==='image/jpeg'?'jpg':f.type==='image/png'?'png':'webp';const path=id+'/'+crypto.randomUUID()+'.'+ext;
 const r=await supa.storage.from(NOTICE_BUCKET).upload(path,f,{cacheControl:'3600',contentType:f.type,upsert:false});if(r.error)throw Object.assign(new Error('사진 업로드 실패: '+r.error.message),{uploaded});uploaded.push(path)}return uploaded;
}
async function noticeSave(ev){
 ev.preventDefault();if(noticeSaving||noticeDeleting)return;noticeSaving=true;noticeFailure='';noticeInfo='';const title=shell.querySelector('#srvNoticeTitle').value.trim(),content=shell.querySelector('#srvNoticeContent').value.trim(),files=[...(shell.querySelector('#srvNoticeFiles')?.files||[])];if(!title||!content){noticeSaving=false;return;}
 const old=noticeEditing?records.announcements.find(x=>x.id===noticeEditing):null;
 if(old&&!noticeCanEdit(old)){noticeFailure='공지 수정 권한이 없습니다.';dashboard();noticeSaving=false;return;}
 const retained=old?[...shell.querySelectorAll('.srv-keep-image:checked')].map(x=>x.value):[];
 if(files.length+retained.length>10){noticeFailure='사진은 총 10장까지 첨부할 수 있습니다.';dashboard();noticeSaving=false;return;}
 if(files.some(f=>!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>5*1024*1024||!f.size)){noticeFailure='사진 형식(JPG/PNG/WEBP)과 장당 5MB 제한을 확인하세요.';dashboard();noticeSaving=false;return;}
 const submit=shell.querySelector('#srvNoticeSubmit');if(submit){submit.disabled=true;submit.textContent='서버 저장 중…';}
 let uploaded=[];let id=old?.id;
 try{
 if(!old){if(!canCreate())throw Error('등록 권한이 없습니다.');const r=await supa.from('jb_announcements').insert({title,content,author_id:profile.id}).select('id').single();if(r.error)throw r.error;id=r.data.id;}
 if(files.length){uploaded=await noticeUpload(id,files);}
 const next=[...retained,...uploaded];
 const r=await supa.from('jb_announcements').update({title,content,image_paths:next}).eq('id',id).select('id');
 if(r.error)throw r.error;if(!r.data?.length)throw Error('공지 수정 권한을 확인하세요.');
 if(old){const removed=noticePaths(old).filter(p=>!retained.includes(p));if(removed.length){const del=await supa.storage.from(NOTICE_BUCKET).remove(removed);if(del.error)noticeInfo='공지는 저장됐으나 일부 이전 사진 정리에 실패했습니다.';}}
 noticeEditing=null;noticeInfo=noticeInfo||'공지와 사진을 저장했습니다.';await loadData();
 }catch(e){
   const failure=String(e.message||e);
   // 신규 공지의 업로드/수정이 실패했다면 사진과 새로 만든 공지를 함께 정리한다.
   // 기존 공지의 실패에서는 기존 내용과 사진을 보존한다.
   if(uploaded.length){const cleanup=await supa.storage.from(NOTICE_BUCKET).remove(uploaded);if(cleanup.error)noticeFailure='업로드 실패 후 사진 정리 오류: '+cleanup.error.message+'\n';}
   if(id&&!old){const rollback=await supa.from('jb_announcements').delete().eq('id',id).select('id');if(rollback.error||!rollback.data?.length)noticeFailure+='새 공지 자동 정리 실패. 공지 목록에서 직접 확인하세요.\n';}
   noticeFailure+=failure;await loadData();
 }finally{noticeSaving=false;}

}
async function noticeRemove(id){if(noticeDeleting||noticeSaving)return;const a=records.announcements.find(x=>x.id===id);if(!a||!noticeCanEdit(a))return;if(!confirm('공지사항과 첨부 사진을 삭제할까요? 복구할 수 없습니다.'))return;

}
const noticeReadPending=new Set();
async function noticeRead(id){
 const a=records.announcements.find(x=>x.id===id);if(!a||!profile)return false;
 if(noticeReadPending.has(id))return false;
 const last=records.reads.find(x=>x.announcement_id===id&&x.employee_id===profile.id);
 if(last&&new Date(last.read_at).getTime()>=new Date(a.updated_at||a.created_at).getTime())return true;
 noticeReadPending.add(id);
 try{
  const now=new Date().toISOString();
  // Supabase INSERT / UPDATE 결과를 실제 서버에서 반환받아 확인합니다.
  const q=last
   ?supa.from('jb_announcement_reads').update({read_at:now}).eq('announcement_id',id).eq('employee_id',profile.id)
   :supa.from('jb_announcement_reads').insert({announcement_id:id,employee_id:profile.id,read_at:now});
  const r=await q.select('announcement_id,employee_id,read_at').maybeSingle();
  if(r.error)throw r.error;
  if(!r.data)throw Error('읽음 기록이 저장되지 않았습니다. 서버 권한 정책을 확인하세요.');
  if(last)last.read_at=r.data.read_at;else records.reads.push(r.data);
  noticeFailure='';
  const el=shell.querySelector(`[data-notice="${id}"]`);
  if(el){el.classList.remove('jb-notice-unread');el.classList.add('jb-notice-read');const tag=el.querySelector('summary .srv-pill');if(tag)tag.textContent='읽음';}
  // 부정확한 가상 집계 대신 실제 서버 집계를 사용합니다.
  const res=await supa.rpc('jb_announcement_read_stats');if(!res.error)records.readStats=res.data||[];
  const summary=el?.querySelector('summary .srv-muted');if(summary){const stat=records.readStats.find(x=>x.announcement_id===id);if(stat)summary.textContent=(a.created_at||'').slice(0,10)+' · 읽음 '+stat.read_count+' / '+stat.total_staff+'명';}
  const toolbar=shell.querySelector('.jb-notice-head .srv-pill');if(toolbar){const remaining=records.announcements.filter(x=>!records.reads.some(y=>y.announcement_id===x.id&&y.employee_id===profile.id&&new Date(y.read_at)>=new Date(x.updated_at||x.created_at))).length;toolbar.textContent='미확인 '+remaining+'건 · 전체 '+records.announcements.length+'건';}
  return true;
 }catch(e){noticeFailure='공지 읽음 처리 실패: '+String(e.message||e);const el=shell.querySelector(`[data-notice="${id}"]`);if(el){let msg=el.querySelector('.jb-notice-read-error');if(!msg){msg=document.createElement('p');msg.className='srv-error jb-notice-read-error';el.append(msg);}msg.textContent=noticeFailure;}return false;
 }finally{noticeReadPending.delete(id);}
}

async function jbAcctRequest(payload){
 const {data,error}=await supa.auth.getSession();
 if(error||!data?.session?.access_token)throw new Error('로그인 세션을 확인하세요.');
 const response=await fetch('/.netlify/functions/account-admin',{
  method:payload?'POST':'GET',cache:'no-store',
  headers:{'authorization':'Bearer '+data.session.access_token,'content-type':'application/json'},
  ...(payload?{body:JSON.stringify(payload)}:{})
 });
 let result={};
 try{result=await response.json()}catch(_){}
 if(!response.ok)throw new Error(result.error||('서버 응답 오류 '+response.status));
 return result;
}
async function jbAcctReload(){

 jbAcctBusy=true;jbAcctMsg='회원가입 계정 확인 중…';dashboard();

 catch(e){jbAcctMsg='조회 실패: '+String(e.message||e)}
 finally{jbAcctBusy=false;dashboard()}
}
async function jbAcctAction(action,userId){
 if(jbAcctBusy||!['owner','manager'].includes(profile?.app_role))return;
 const acct=jbAcctState?.accounts?.find(a=>a.id===userId);
 if(!acct)return;
 const payload={action,userId};
 if(action==='unlink'){
  if(!confirm('로그인 계정 연결을 해제할까요?\\n업무·근태·직원 기록은 유지됩니다.'))return;
 }else if(action==='delete'){
  if(profile.app_role!=='owner'||acct.employee)return;

  if(!confirm(acct.email+'로 인증메일을 다시 보낼까요?'))return;
 }else return;
 jbAcctBusy=true;jbAcctMsg='요청 처리 중…';dashboard();

  if(action==='unlink'||action==='link')await loadData();

}

// V6.6.5 서버 상태 변경 이력 기반 시간 계산. 동일 기기·브라우저 저장값 사용하지 않음.
function taskClock(t, now=Date.now()){
 const entries=(records.taskHistory||[]).filter(h=>h.task_id===t.id&&h.changed_at).slice().sort((a,b)=>new Date(a.changed_at)-new Date(b.changed_at));
 const started=Date.parse(t.created_at||'');
 if(!Number.isFinite(started))return {running:0,holding:0,valid:false,mode:t.status};
 // 최초 생성은 예정으로 등록되는 기존 서버 정책을 적용.
 let last=started, state='planned', planned=0, running=0, holding=0;
 for(const h of entries){
  const at=Date.parse(h.changed_at);
  if(!Number.isFinite(at)||at<last)continue;
  const dur=Math.max(0,at-last);
  if(state==='planned')planned+=dur;
  if(state==='in_progress')running+=dur;
  if(state==='hold')holding+=dur;
  state=h.new_status||state;last=at;
 }
 const dur=Math.max(0,now-last);
 if(state==='planned')planned+=dur;
  if(state==='in_progress')running+=dur;
 if(state==='hold')holding+=dur;
 const valid=entries.length>0||t.status==='planned';
 // 현재 상태가 변경 이력의 최종 상태와 다른 경우 데이터 불일치로 표기
 return {planned,running,holding,valid:valid&&state===t.status,mode:state};
}
function durationLabel(ms){
 const sec=Math.floor(Math.max(0,ms)/1000),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
 return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function serverClockHtml(t){
 const v=taskClock(t);
 if(!v.valid)return '<div class="srv-muted" style="margin-top:8px">⏱ 과거 상태 변경 이력이 부족해 누적 시간을 확정할 수 없습니다.</div>';
 return `<div class="srv-row srv-clock" data-clock-task="${safe(t.id)}" style="margin:8px 0;font-size:12px"><span>◷ 예정 누적 <b data-clock-planned>${durationLabel(v.planned)}</b></span><span>▶ 진행 누적 <b data-clock-running>${durationLabel(v.running)}</b></span><span>Ⅱ 보류 누적 <b data-clock-holding>${durationLabel(v.holding)}</b></span>${['planned','in_progress','hold'].includes(t.status)?'<span class="srv-pill">실시간 집계</span>':''}</div>`;
}

// V6.6.6.8: Reduce large task photos before uploading, without changing existing photo records.
async function prepareJbTaskPhoto(file){
 if(file.size<=1024*1024)return file;
 const image=await new Promise((resolve,reject)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};
  img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('사진 파일을 열 수 없습니다.'))};
  img.src=url;
 });
 const originalWidth=image.naturalWidth,originalHeight=image.naturalHeight;
 if(!originalWidth||!originalHeight)throw new Error('사진 크기를 확인할 수 없습니다.');
 const render=async (maxSide,quality)=>{
  const scale=Math.min(1,maxSide/Math.max(originalWidth,originalHeight));
  const canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(originalWidth*scale));
  canvas.height=Math.max(1,Math.round(originalHeight*scale));
  const ctx=canvas.getContext('2d');
  if(!ctx)throw new Error('사진 압축을 사용할 수 없는 브라우저입니다.');
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(image,0,0,canvas.width,canvas.height);
  return await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('사진 압축에 실패했습니다.')),'image/jpeg',quality));
 };
 let result=await render(1600,0.78);
 if(result.size>5*1024*1024)result=await render(1200,0.65);
 // Never increase storage usage simply because an originally compressed image is small.
 if(file.size<=5*1024*1024&&file.size<=result.size)return file;
 return new File([result],file.name.replace(/\.[^.]+$/,'')+'_optimized.jpg',{type:'image/jpeg',lastModified:Date.now()});
}

// Request fast push only after a successful server-side comment INSERT.
// On-demand delivery is best-effort; the 1-minute scheduled sender is the fallback.
async function jbWakeServerPush(type,eventId){
 if(!['comment','task','report'].includes(type)||!eventId||location.protocol!=='https:'||!supa)return;
 try{
  const {data,error}=await supa.auth.getSession();
  if(error||!data?.session?.access_token)return;
  const response=await fetch('/.netlify/functions/push-now',{
   method:'POST',headers:{
    'content-type':'application/json',
    authorization:'Bearer '+data.session.access_token
   },body:JSON.stringify({type,eventId}),cache:'no-store'
  });
  if(!response.ok)console.warn('JB 즉시 푸시 요청 HTTP '+response.status+'; 1분 예약 발송 점검 ('+type+')');
  else if(response.status===202)console.info('JB 즉시 푸시 미확정, 서버 예약 발송 및 기기 구독 확인 필요 ('+type+')');
 }catch(error){
  // Do not mark the comment itself as failed; scheduled dispatch remains available.
  console.warn('JB 즉시 푸시 요청 실패, 정기 발송으로 재시도',String(error?.message||error));
 }
}

 try{
 const checked=!!form.querySelector('[name="request_review"]')?.checked;
 const ownerChecked=!!form.querySelector('[name="request_owner"]')?.checked;
 if(ownerChecked&&checked)throw new Error('상급자 확인 요청과 대표님 직접 보고 중 하나만 선택해 주세요.');

 jbValidateTaskAttachmentFiles(files);

 await loadData();

 if(photoError)alert('보고 내용은 저장됐지만 사진 일부를 첨부하지 못했습니다. 업무 상세에서 다시 등록해 주세요.\n'+photoError);
 }
 catch(e){alert('댓글 저장 실패: '+String(e.message||e));if(btn)btn.disabled=false;}

// V6.6.8.6.1: 본인 댓글 수정·삭제 (대표는 삭제만 추가 허용)
let commentChangeBusy=false;
async function changeServerComment(id,mode){
 if(commentChangeBusy||!profile||!supa)return;
 const c=records.taskComments.find(x=>x.id===id);
 if(!c)return alert('댓글 정보가 변경되었습니다. 새로고침 후 다시 시도하세요.');
 const mine=c.author_id===profile.id;
 if(mode==='edit'&&!mine)return alert('본인 댓글만 수정할 수 있습니다.');
 if(mode==='delete'&&!mine&&profile.app_role!=='owner')return alert('본인 댓글만 삭제할 수 있습니다.');
 let next='';
 if(mode==='edit'){
  const entered=prompt('댓글 내용을 수정하세요. (최대 2,000자)',c.body||'');
  if(entered===null)return;
  next=entered.trim();
  if(!next||next.length>2000)return alert('댓글은 1~2,000자로 입력하세요.');
  if(next===c.body)return;
 }else if(mode==='delete'){
  if(!confirm('이 댓글을 삭제할까요? 삭제 후에는 복구할 수 없습니다.'))return;
 }else return;
 commentChangeBusy=true;
 try{
  const request=supa.from('jb_task_comments');
  const result=mode==='edit'?await request.update({body:next}).eq('id',id).select('id'):await request.delete().eq('id',id).select('id');
  if(result.error)throw result.error;
  if(!result.data?.length)throw new Error('변경된 행이 없습니다. Supabase 권한 정책을 확인하세요.');
  await loadData();
 }catch(e){alert('댓글 '+(mode==='edit'?'수정':'삭제')+' 실패: '+String(e.message||e));}
 finally{commentChangeBusy=false;}
}

// V6.6.5: 완료 업무 월별 별도 조회 (최근 100건 업무 목록과 독립)
function archiveDates(month){
 const [y,m]=month.split('-').map(Number);
 if(!y||m<1||m>12)throw new Error('연월을 확인하세요.');
 const first=`${month}-01`,last=new Date(Date.UTC(y,m,1)).toISOString().slice(0,10);
 return [first,last,new Date(Date.UTC(y,m,0)).getUTCDate()];
}
// V6.6.7.4: Derive calendar counts from all monthly results, but display
// only the newest 1,000 rows for responsive rendering. Older rows remain
// available from the month/day CSV export. Ignore stale month fetches.
let archiveDayCounts={};
let archiveDepartment='all';
let archiveLoadSerial=0;
async function loadArchive(){
 if(!profile||!supa)return;
 const serial=++archiveLoadSerial;
 const month=archiveMonth;
 archiveLoading=true;archiveError='';archiveRows=[];archiveDayCounts={};archiveTruncated=false;dashboard();
 try{
  const [first,last]=archiveDates(month);
  const from=new Date(first+'T00:00:00+09:00').toISOString();
  const to=new Date(last+'T00:00:00+09:00').toISOString();
  const counts={},preview=[];
  const pageSize=500,maxRows=20000;
  let total=0,finished=false;
  for(let offset=0;offset<=maxRows;offset+=pageSize){
   let query=supa.from('jb_tasks').select('id,title,description,status,assignee_id,department_id,due_date,completed_at,created_at').eq('status','completed').gte('completed_at',from).lt('completed_at',to);
    if(archiveDepartment!=='all')query=query.eq('department_id',archiveDepartment);
    const {data,error}=await query.order('completed_at',{ascending:false}).order('id',{ascending:true})
    .range(offset,offset+pageSize-1);
   if(error)throw error;
   if(serial!==archiveLoadSerial)return;
   const batch=data||[];
   for(const t of batch){
    const day=new Date(t.completed_at).toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});
    counts[day]=(counts[day]||0)+1;
    if(preview.length<1000)preview.push(t);
   }
   total+=batch.length;
   if(batch.length<pageSize){finished=true;break;}
  }
  if(serial!==archiveLoadSerial)return;
  archiveDayCounts=counts;
  archiveRows=preview;
  archiveTruncated=total>preview.length;
  if(!finished)archiveError='한 달의 완료 업무가 20,000건 이상일 수 있어 달력 집계가 중단됐습니다. CSV 내보내기도 기간을 나누어 사용해 주세요.';
 }catch(e){if(serial===archiveLoadSerial)archiveError=String(e.message||e)}
 finally{if(serial===archiveLoadSerial){archiveLoading=false;if(view==='archive')dashboard()}}
}
// V6.6.7.2: Download completed-task records for Excel 2021.
// UTF-8 BOM and comma-separated quoted cells preserve Korean text and line breaks.
// Month AND day exports both fetch matching records directly with pagination.
let archiveExportBusy=false;
async function exportCompletedTasksCsv(mode="month"){
 if(archiveExportBusy)return;
 if(archiveLoading)return alert('조회가 끝난 뒤 내보내기 해 주세요.');
 const selectedMonth=archiveMonth,selectedDay=mode==='day'?archiveDay:'',selectedDepartment=archiveDepartment;
 if(mode==='day'&&!selectedDay)return alert('달력에서 날짜를 먼저 선택해 주세요.');
 archiveExportBusy=true;
 const buttons=[...shell.querySelectorAll('[data-srv-archive-export]')];
 buttons.forEach(b=>{b.disabled=true;b.textContent='CSV 준비 중...';});
 const button=buttons.find(b=>b.dataset.srvArchiveExport===mode);
 try{
  // V6.6.7.2: Both month and day exports query the database directly.
  // This does not depend on the calendar's 1,000-row preview limit.
  let chosen=[];
  const [first,last]=archiveDates(selectedMonth);
  const rangeStart=selectedDay||first;
  const nextDay=selectedDay ? new Date(Date.parse(selectedDay+'T00:00:00Z')+86400000).toISOString().slice(0,10) : last;
  if(selectedDay && !/^\d{4}-\d{2}-\d{2}$/.test(selectedDay))throw new Error('선택한 날짜가 올바르지 않습니다.');
  const from=new Date(rangeStart+'T00:00:00+09:00').toISOString();
  const to=new Date(nextDay+'T00:00:00+09:00').toISOString();
  const pageSize=500,maxRows=20000;
  let finished=false;
  for(let offset=0;offset<=maxRows;offset+=pageSize){
    let query=supa.from('jb_tasks').select('id,title,description,status,assignee_id,department_id,due_date,completed_at,created_at').eq('status','completed').gte('completed_at',from).lt('completed_at',to);
    if(selectedDepartment!=='all')query=query.eq('department_id',selectedDepartment);
    const {data,error}=await query.order('completed_at',{ascending:false}).order('id',{ascending:true})
      .range(offset,offset+pageSize-1);
    if(error)throw error;
    const batch=data||[];
    chosen.push(...batch);
    if(button)button.textContent=`CSV 준비 중... ${chosen.length}건`;
    if(batch.length<pageSize){finished=true;break;}
  }
  if(!finished||chosen.length>maxRows)throw new Error('완료 업무가 20,000건을 초과합니다. 조회 기간을 나누어 내려받아 주세요.');
  if(!chosen.length)return alert('내보낼 완료 업무가 없습니다.');
  const headers=['완료일','완료시각','업무명','업무내용','담당자','부서','목표일','업무ID'];
  const safeCsvValue=v=>{
   let x=String(v==null?'':v);
   if(/^\s*[=+@\-\t\r]/.test(x))x="'"+x;
   return '"'+x.replace(/"/g,'""')+'"';
  };
  const rows=chosen.map(t=>{
   const finished=new Date(t.completed_at);
   const day=finished.toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});
   const timestamp=finished.toLocaleString('ko-KR',{timeZone:'Asia/Seoul',hour12:false});
   const employee=records.employees.find(e=>e.id===t.assignee_id);
   const department=records.departments.find(d=>d.id===(t.department_id||employee?.department_id));
   return [day,timestamp,t.title,t.description||'',employee?.name||'직원명 확인 불가',department?.name||'부서 확인 불가',t.due_date||'',t.id];
  });
  const csv='\ufeff'+[headers,...rows].map(r=>r.map(safeCsvValue).join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  const a=document.createElement('a');a.href=url;a.download=`JB_Completed_Tasks_${selectedDay||selectedMonth}.csv`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
  alert(`${selectedDay?'선택한 날짜':'선택한 월'} 완료 업무 ${chosen.length}건의 CSV 다운로드를 요청했습니다. 브라우저 다운로드 목록을 확인하세요.`);
 }catch(e){alert('완료 업무 CSV 저장 실패: '+String(e.message||e));}
 finally{archiveExportBusy=false; shell.querySelectorAll('[data-srv-archive-export]').forEach(b=>{b.disabled=!!archiveLoading||(b.dataset.srvArchiveExport==='day'&&!archiveDay);b.textContent=b.dataset.srvArchiveExport==='month'?'⬇ 월 전체 CSV 저장':'⬇ 선택 날짜 CSV 저장';});}
}

 return jbStaffDisplaySorted(records.employees).map(e=>{

  let running=0,holding=0,unverified=0;
  ts.forEach(t=>{const c=taskClock(t);if(c.valid){running+=c.running;holding+=c.holding;}else unverified++;});
  const dept=records.departments.find(d=>d.id===e.department_id)?.name||'미지정';
  return {id:e.id,name:e.name||'미등록',position:e.position||'',dept,total:ts.length,
   runningCount:ts.filter(t=>t.status==='in_progress').length,
   heldCount:ts.filter(t=>t.status==='hold').length,
   plannedCount:ts.filter(t=>t.status==='planned').length,
   completedCount:ts.filter(t=>t.status==='completed').length,
   running,holding,unverified};
 });
}
function downloadReportCsv(){
 if(!profile||!['owner','manager'].includes(profile.app_role))return;
 const escapeCell=x=>{let value=String(x??'');if(/^[\s]*[=+@\-\t\r]/.test(value))value="'"+value;return '"'+value.replace(/"/g,'""')+'"';};
 const lines=[['부서','직원','직급','진행중','보류','예정','완료','전체','진행 누적','보류 누적','시간 이력 부족 건수']];

async function jbPushEnable(){

 try{
  if(!jbPushSupported())throw Error('휴대폰 푸시는 HTTPS로 배포한 주소에서만 등록할 수 있습니다. 다운로드 HTML은 푸시 지원 대상이 아닙니다.');

  if(!key)throw Error('서버의 VAPID 공개키가 설정되지 않았습니다. 관리자에게 문의하세요.');
  localStorage.setItem('jb_push_vapid_public',key);
  const permission=await Notification.requestPermission();
  if(permission!=='granted')throw Error('휴대폰 알림 권한이 허용되지 않았습니다. 브라우저 및 휴대폰 알림 설정을 확인하세요.');

   return supa.from('jb_push_subscriptions').upsert({employee_id:profile.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth_secret:j.keys.auth,user_agent:navigator.userAgent,updated_at:new Date().toISOString()},{onConflict:'endpoint'});
  };

  if(saveResult.error&&/row-level security|42501/i.test(String(saveResult.error.message||'')+' '+String(saveResult.error.code||''))){

   subscription=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:bytes});
   saveResult=await saveSubscription(subscription);
  }
  if(saveResult.error)throw saveResult.error;
  say('현재 로그인한 계정의 휴대폰 푸시 등록 완료.');

function jbMealV14WarnDirty(){return !(jbMealV14Dirty||jbMealRegularDirty)||confirm('저장하지 않은 변경 사항이 있습니다. 이동할까요?')}
function jbMealV14ChangeMonth(n){const [y,m]=jbMealV14Month.split('-').map(Number),d=new Date(y,m-1+n,1);jbMealV14Month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');jbMealV14Day='';void jbMealV14Load()}
async function jbMealV14SaveStaff(){
 if(jbMealV14Saving||jbMealV14Loading)return;
 if(jbMealDinnerClosedForSelected()){jbMealV14Error='저녁 신청 마감시간이 지났습니다.';dashboard();return;}
 const items=jbMealV14People().map(e=>({employee_id:e.id,eating:!!jbMealV14Draft?.[e.id]?.eating,location:jbMealV14Type==='lunch'?(jbMealV14Draft?.[e.id]?.location||'농원'):null}));
 jbMealV14Saving=true;dashboard();
 try{const {error}=await supa.rpc('jb_meal_save_staff_v14',{p_date:jbMealV14Date,p_meal:jbMealV14Type,p_department:jbMealV14Dept,p_items:items});if(error)throw error;await jbMealV14Load()}
 catch(e){jbMealV14Error='직원 명단 저장 실패: '+String(e.message||e);dashboard()}

}

 const args={p_date:jbMealV14Date,p_meal:jbMealV14Type,p_department:jbMealV14Dept,p_kind:shell.querySelector('#meal-guest-kind')?.value,p_count:count,p_location:jbMealV14Type==='lunch'?shell.querySelector('#meal-guest-place')?.value:null,p_note:shell.querySelector('#meal-guest-note')?.value.trim()||''};
 try{const {error}=await supa.rpc('jb_meal_add_guest_v14',args);if(error)throw error;await jbMealV14Load()}
 catch(e){jbMealV14Error='외부 인원 등록 실패: '+String(e.message||e);dashboard()}

async function jbMealV14CopyYesterday(){

 if(error){jbMealV14Error=error.message;dashboard();return}

 jbMealV14MakeDraft();
 for(const e of data){if(jbMealV14Draft[e.employee_id])jbMealV14Draft[e.employee_id]={eating:true,location:e.location||'농원'}}
 jbMealV14Dirty=true;jbMealV14Error='전날 직원 명단을 가져왔습니다. 저장 버튼을 눌러야 반영됩니다.';dashboard();
}

document.addEventListener('click',e=>{

 if(b.id==='meal-regular-copy')return void jbMealRegularCopyYesterday();
 if(b.id==='meal-regular-save')return void jbMealRegularSave();

 if(b.classList.contains('meal-regular-disable'))return void jbMealRegularManage(b.dataset.id,true);
 if(b.id==='meal-copy-yesterday')return void jbMealV14CopyYesterday();
 if(b.id==='meal-save-staff')return void jbMealV14SaveStaff();
 if(b.id==='meal-add-guest')return void jbMealV14AddGuest();
 if(b.classList.contains('meal-delete-guest'))return void jbMealV14RemoveGuest(b.dataset.id);
});
