async function jbMealRegularManage(id,deactivate){
 if(!['owner','manager','staff'].includes(profile?.app_role))return;
 
 const existing=id?jbMealRegularPeople.find(x=>x.id===id):null;
 if(id&&!existing)return;
 if(deactivate&&profile.app_role==='staff'){alert('고정 인원 비활성화는 관리자에게 요청해 주세요.');return;}
 if(deactivate&&!confirm('고정 식사 명단에서 비활성화할까요? 이미 저장된 과거 신청 내역은 유지됩니다.'))return;
 const name=existing?.display_name||shell.querySelector('#meal-regular-name')?.value.trim()||'';
 const place=existing?.default_location||shell.querySelector('#meal-regular-place-default')?.value||'농원';
 const lunch=existing?.default_lunch??!!shell.querySelector('#meal-regular-lunch-default')?.checked;
 const dinner=existing?.default_dinner??!!shell.querySelector('#meal-regular-dinner-default')?.checked;
 if(!name||name.length>80){alert('고정 인원 이름을 1~80자로 입력하세요.');return}
 try{
  const {error}=profile.app_role==='staff'
   ?await supa.rpc('jb_meal_regular_add_staff_v13',{p_department:jbMealV14Dept,p_name:name,p_place:place,p_lunch:lunch,p_dinner:dinner})
   :await supa.rpc('jb_meal_regular_manage_v15',{p_id:id||null,p_department:jbMealV14Dept,p_name:name,p_place:place,p_lunch:lunch,p_dinner:dinner,p_active:!deactivate});
  if(error)throw error;
  await jbMealV14Load();
  jbMealRegularMessage=deactivate?'고정 인원을 비활성화했습니다.':'고정 식사 인원을 등록했습니다.';
  dashboard();
 }catch(e){jbMealV14Error='고정 명단 관리 실패: '+String(e.message||e);dashboard()}
}
async function jbMealRegularCopyYesterday(){
 if(!jbMealV14WarnDirty())return;
 const d=new Date(jbMealV14Date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-1);
 const previous=d.toISOString().slice(0,10);
 const response=await supa.from('jb_meal_regular_orders_v15').select('regular_id,location').eq('meal_date',previous).eq('meal_type',jbMealV14Type);
 if(response.error){jbMealV14Error='전날 고정 인원 조회 실패: '+response.error.message;dashboard();return}
 const list=response.data||[];
 const eligible=jbMealRegularPeople.filter(x=>x.active&&x.department_id===jbMealV14Dept);
 if(!eligible.some(x=>list.some(r=>r.regular_id===x.id))){jbMealV14Error='전날 저장된 고정 인원 신청이 없습니다.';dashboard();return}
 jbMealRegularDraft={};
 for(const e of eligible){
  const r=list.find(x=>x.regular_id===e.id);
  jbMealRegularDraft[e.id]={eating:!!r,location:r?.location||e.default_location||'농원'};
 }
 jbMealRegularDirty=true;jbMealV14Error='전날 고정 인원 명단을 불러왔습니다. 저장 버튼을 눌러 확정하세요.';dashboard();
}


async function jbMealCutoffSave(){
 if(!['owner','manager'].includes(profile?.app_role)||jbMealCutoffSaving)return;
 const input=shell.querySelector('#meal-cutoff-time');
 const proposed=String(input?.value||'');
 if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(proposed)){
  alert('마감시간을 00:00~23:59 형식으로 선택하세요.');return;
 }
 if(proposed===jbMealV14Settings){jbMealCutoffMessage='현재 설정된 마감시간과 동일합니다.';dashboard();return}
 if(!confirm('전체 부서의 저녁 신청 마감시간을 '+proposed+'(으)로 변경할까요?'))return;
 jbMealCutoffSaving=true;jbMealCutoffMessage='';dashboard();
 try{
  const {data,error}=await supa.rpc('jb_meal_set_deadline_v15',{p_deadline:proposed});
  if(error)throw error;
  const {data:setting,error:readError}=await supa.from('jb_meal_settings').select('dinner_deadline').eq('id',true).single();
  if(readError)throw readError;
  const confirmed=String(setting?.dinner_deadline||'').slice(0,5);
  if(confirmed!==proposed)throw new Error('저장 결과와 서버의 마감시간이 일치하지 않습니다.');
  jbMealV14Settings=confirmed;
  jbMealCutoffMessage='마감시간이 '+confirmed+'(으)로 저장되었습니다. 모든 부서에 공통 적용됩니다.';
 }catch(e){
  jbMealV14Error='저녁 마감시간 변경 실패: '+String(e.message||e);
 }finally{jbMealCutoffSaving=false;if(view==='meals')dashboard()}
}

  const reload=shell.querySelector('#srvTemplateReload');if(reload)reload.onclick=loadRepeatTemplates;
  // V6.6.6.9: client-side search/status filter (no additional server calls).
  const myTaskSearch=shell.querySelector('#srvMyTaskSearch');
  const myTaskFilter=shell.querySelector('#srvMyTaskFilter');
  const applyMyTaskFilter=()=>{
    const q=(myTaskSearch?.value||'').trim().toLocaleLowerCase('ko-KR');
    const state=myTaskFilter?.value||'all';
    let count=0;
    shell.querySelectorAll('.srv-my-task-card').forEach(card=>{
      const matched=(state==='all'||card.dataset.taskStatus===state)&&(!q||(card.dataset.taskSearch||'').toLocaleLowerCase('ko-KR').includes(q));
      card.hidden=!matched;card.style.display=matched?'':'none';
      if(matched)count++;
    });
    const summary=shell.querySelector('#srvMyTaskMatch');if(summary)summary.textContent=count+'건 표시';
  };
  if(myTaskSearch)myTaskSearch.oninput=applyMyTaskFilter;
  if(myTaskFilter)myTaskFilter.onchange=applyMyTaskFilter;
  if(myTaskSearch)applyMyTaskFilter();
  shell.querySelectorAll('.srv-status').forEach(sel=>sel.onchange=()=>changeTaskStatus(sel.dataset.task,sel.value));

  shell.querySelectorAll('.srv-task-detail').forEach(btn=>btn.onclick=()=>{expandedServerTask=expandedServerTask===btn.dataset.id?null:btn.dataset.id;resetTaskPhoto();dashboard();if(expandedServerTask)loadTaskPhoto(expandedServerTask);});
  shell.querySelectorAll('.srv-task-comment-form').forEach(f=>f.onsubmit=submitServerComment);
  const photoForm=shell.querySelector('#srvTaskPhotoForm');if(photoForm)photoForm.onsubmit=uploadTaskPhoto;
  shell.querySelectorAll('.srv-task-photo-delete').forEach(btn=>btn.onclick=()=>deleteTaskPhoto(btn.dataset.id,btn.dataset.taskId));
  shell.querySelectorAll('.srv-task-photo-open').forEach(btn=>btn.onclick=()=>{expandedServerTask=btn.dataset.id;resetTaskPhoto();dashboard();loadTaskPhoto(expandedServerTask);setTimeout(()=>shell.querySelector('#srvTaskPhotoForm')?.scrollIntoView({behavior:'smooth',block:'center'}),40);});
 }
}

async function initialize(){
 if(!window.supabase||!window.supabase.createClient){shell.innerHTML='<div class="srv-box"><h1>연결 라이브러리 로딩 실패</h1><p>인터넷 연결 또는 jsDelivr 접근 여부를 확인하고 새로고침해 주세요.</p></div>';return;}
 try{const callbackError=jbAuthCallbackErrorMessage();supa=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage}});const {data:{session},error}=await supa.auth.getSession();if(error){if(callbackError){login(callbackError);return;}throw error;}if(session)await loadProfile();else login(callbackError);}catch(e){login(jbAuthCallbackErrorMessage()||'일시적인 연결 오류입니다. 저장된 서버 주소와 공개키는 유지됩니다. 인터넷 연결을 확인한 후 다시 열어주세요. ('+String(e.message||e)+')')}
}
// V1.3 test: automatic onboarding on published HTTPS sites.
// Supabase publishable keys are client-visible by design; never fetch private keys.
async function jbStartConnection(){
 if(location.protocol==='https:'){
  try{
   const res=await fetch('/.netlify/functions/public-config',{cache:'no-store'});
   if(res.ok){
    const remote=await res.json();
    const url=String(remote?.url||'').replace(/\/+$/,'');
    const key=String(remote?.key||'');
    if(/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)&&key.startsWith('sb_publishable_')){
     // Always prefer the deployed site's environment to a stale config in
     // localStorage (e.g. after a test/prod account change).
     cfg={url,key};saved();
     await initialize();return;
    }
   }
  }catch(error){
   console.warn('공개 Supabase 설정 자동 조회 실패; 저장된 연결 설정을 확인합니다.');
  }
 }
 if(cfg.url&&cfg.key){await initialize();return;}
 // Development/local builds retain manual setup. A production deployment must
 // configure SUPABASE_PUBLISHABLE_KEY to avoid exposing this staff-facing page.
 setup();
}
rosterDate=localDay();void jbStartConnection();
})();
</script><script>
// 모바일 사진 촬영: 기존 사진 업로드 input으로 촬영 파일을 합쳐 전달합니다.
function jbOpenCamera(button, targetName) {
  const scope = button.closest('form') || document;
  const target = targetName === 'task_photo'
    ? scope.querySelector('input[type="file"]')
    : (scope.querySelector('[name="'+targetName+'"]') || document.getElementById(targetName));
  if (!target) return alert('사진 첨부 입력란을 찾을 수 없습니다.');
  const camera = document.createElement('input');
  camera.type = 'file';
  camera.accept = 'image/*';
  camera.setAttribute('capture', 'environment');
  camera.style.display = 'none';
  scope.appendChild(camera);
  camera.addEventListener('change', () => {
    try {
      if (camera.files && camera.files.length) {
        const transfer = new DataTransfer();
        if (target.multiple) for (const file of target.files) transfer.items.add(file);
        for (const file of camera.files) transfer.items.add(file);
        target.files = transfer.files;
        target.dispatchEvent(new Event('change', {bubbles:true}));
      }
    } catch(e) { alert('촬영 사진을 첨부하지 못했습니다. 사진 선택을 이용해 주세요.'); }
    camera.remove();
  }, {once:true});
  camera.click();
}
</script>
