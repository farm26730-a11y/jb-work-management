// Request fast push only after a successful server-side comment INSERT.
// On-demand delivery is best-effort; the 1-minute scheduled sender is the fallback.
async function jbWakeServerPush(type,eventId){
 if(!['comment','task','report'].includes(type)||!eventId||location.protocol!=='https:'||!supa)return;
 try{
  const {data,error}=await supa.auth.getSession();
  if(error||!data?.session?.access_token)return;
  const response=await fetch('/.netlify/functions/push-now',{
   method:'POST',headers:{
    'content-type':'application/json',
    authorization:'Bearer '+data.session.access_token
   },body:JSON.stringify({type,eventId}),cache:'no-store'
  });
  if(!response.ok)console.warn('JB 즉시 푸시 요청 HTTP '+response.status+'; 1분 예약 발송 점검 ('+type+')');
  else if(response.status===202)console.info('JB 즉시 푸시 미확정, 서버 예약 발송 및 기기 구독 확인 필요 ('+type+')');
 }catch(error){
  // Do not mark the comment itself as failed; scheduled dispatch remains available.
  console.warn('JB 즉시 푸시 요청 실패, 정기 발송으로 재시도',String(error?.message||error));
 }
}
const uncertainCommentForms=new WeakSet();
async function submitServerComment(ev){
 ev.preventDefault();if(commentSubmitting||!profile)return;
 const form=ev.currentTarget,task_id=form.dataset.taskId;
 const files=Array.from(form.querySelector('[name="report_photos"]')?.files||[]);
 const body=form.querySelector('textarea').value.trim()||(files.length?'사진 첨부':'');
 if(!records.tasks.some(t=>t.id===task_id))return alert('조회할 수 없는 업무입니다. 새로고침 후 확인해 주세요.');
 if(!body||body.length>2000)return alert('댓글 내용 또는 사진을 입력하세요. (내용은 최대 2,000자)');
 if(uncertainCommentForms.has(form)&&!confirm('이전 댓글이 이미 저장됐을 수 있습니다. 기존 댓글을 확인하셨나요? 다시 등록하면 중복될 수 있습니다.'))return;
 const selector='.srv-home-detail-comment-form button[type="submit"], .srv-task-comment-form button[type="submit"]';
 const btn=form.querySelector('button[type="submit"]');
 commentSubmitting=true;
 if(btn){btn.disabled=true;btn.textContent='등록 중...';}
 let saving=false,savedComment=false;
 try{
 const checked=!!form.querySelector('[name="request_review"]')?.checked;
 const ownerChecked=!!form.querySelector('[name="request_owner"]')?.checked;
 if(ownerChecked&&checked)throw new Error('상급자 확인 요청과 대표님 직접 보고 중 하나만 선택해 주세요.');
 jbValidateTaskAttachmentFiles(files);
 const isReport=checked||ownerChecked;
 const needsReportCommentId=isReport&&files.length>0;
 saving=true;
 let result;
 if(needsReportCommentId){
  result=await supa.rpc('jb_submit_task_report_comment_id_v13',{p_task_id:task_id,p_body:body,p_target_owner:ownerChecked});
 }else if(ownerChecked){
  result=await supa.rpc('jb_submit_task_owner_report_v14',{p_task_id:task_id,p_body:body});
 }else if(checked){
  result=await supa.rpc('jb_submit_task_comment_report',{p_task_id:task_id,p_body:body,p_request_review:true});
 }else{
  result=await supa.from('jb_task_comments').insert({task_id,author_id:profile.id,body}).select('id').single();
 }
 if(result.error){
  saving=!result.error.code||result.status>=500;
  if(needsReportCommentId&&['PGRST202','42883'].includes(result.error.code)){
   throw new Error('사진을 포함한 보고는 서버 준비가 필요합니다. 입력 내용과 선택한 사진은 그대로 유지됩니다.');
  }
  throw result.error;
 }
 savedComment=true;
 uncertainCommentForms.delete(form);
 form.reset();
 if(isReport)void jbWakeServerPush('report',task_id);
 let photoError='';
 // Legacy report responses contain a request ID or no ID.
 const commentId=needsReportCommentId?result.data:!isReport?result.data?.id:null;
 if(commentId)void jbWakeServerPush('comment',commentId);
 if(files.length){try{
  if(!commentId)throw new Error('댓글은 저장됐지만 사진을 연결할 댓글 ID를 확인하지 못했습니다.');
  await jbUploadTaskAttachments(task_id,files,commentId);
 }catch(e){photoError=String(e.message||e)}}
 await loadData();
 if(expandedServerTask===task_id||homeSelectedTask===task_id)await loadTaskPhoto(task_id);
 if(photoError)alert('보고 내용은 저장됐지만 사진 일부를 첨부하지 못했습니다. 해당 댓글의 ‘사진 추가’에서 빠진 파일만 추가해 주세요.\n'+photoError);
 }
 catch(e){
  const message=savedComment?'댓글은 저장됐지만 화면 갱신에 실패했습니다. 목록을 새로고침해 주세요.':
   saving?'댓글 저장 결과를 확인할 수 없습니다. 입력과 사진은 유지됩니다. 다시 등록하기 전에 기존 댓글을 확인해 주세요.':'댓글 저장 실패';
  if(saving&&!savedComment)uncertainCommentForms.add(form);
  alert(message+'\n'+String(e.message||e));
 }
 finally{
  commentSubmitting=false;
  const buttons=new Set([btn,...shell.querySelectorAll(selector)]);
  for(const button of buttons){
   if(!button)continue;
   button.disabled=false;
   button.textContent='댓글 등록';
  }
 }
}

let commentChangeBusy=false;
async function changeServerComment(id,mode){

 const c=records.taskComments.find(x=>x.id===id);
 if(!c)return alert('댓글 정보가 변경되었습니다. 새로고침 후 다시 시도하세요.');
 const mine=c.author_id===profile.id;
 if(mode==='edit'&&!mine)return alert('본인 댓글만 수정할 수 있습니다.');
 if(mode==='delete'&&!mine&&profile.app_role!=='owner')return alert('본인 댓글만 삭제할 수 있습니다.');
 let next='';
 if(mode==='edit'){
  const entered=prompt('댓글 내용을 수정하세요. (최대 2,000자)',c.body||'');
  if(entered===null)return;
  next=entered.trim();
  if(!next||next.length>2000)return alert('댓글은 1~2,000자로 입력하세요.');
  if(next===c.body)return;
 }else if(mode==='delete'){
  if(!confirm('이 댓글을 삭제할까요? 삭제 후에는 복구할 수 없습니다.'))return;
 }else return;
 commentChangeBusy=true;

  const request=supa.from('jb_task_comments');
  const result=mode==='edit'?await request.update({body:next}).eq('id',id).select('id'):await request.delete().eq('id',id).select('id');

 }catch(e){alert('댓글 '+(mode==='edit'?'수정':'삭제')+' 실패: '+String(e.message||e));}

// V6.6.5: 완료 업무 월별 별도 조회 (최근 100건 업무 목록과 독립)
function archiveDates(month){
 const [y,m]=month.split('-').map(Number);
 if(!y||m<1||m>12)throw new Error('연월을 확인하세요.');
 const first=`${month}-01`,last=new Date(Date.UTC(y,m,1)).toISOString().slice(0,10);
 return [first,last,new Date(Date.UTC(y,m,0)).getUTCDate()];
}
// V6.6.7.4: Derive calendar counts from all monthly results, but display
// only the newest 1,000 rows for responsive rendering. Older rows remain
// available from the month/day CSV export. Ignore stale month fetches.
let archiveDayCounts={};
let archiveDepartment='all';
let archiveLoadSerial=0;
async function loadArchive(){
 if(!profile||!supa)return;
 const serial=++archiveLoadSerial;
 const month=archiveMonth;
 archiveLoading=true;archiveError='';archiveRows=[];archiveDayCounts={};archiveTruncated=false;dashboard();
 try{
  const [first,last]=archiveDates(month);
  const from=new Date(first+'T00:00:00+09:00').toISOString();
  const to=new Date(last+'T00:00:00+09:00').toISOString();
  const counts={},preview=[];
  const pageSize=500,maxRows=20000;
  let total=0,finished=false;
  for(let offset=0;offset<=maxRows;offset+=pageSize){
   let query=supa.from('jb_tasks').select('id,title,description,status,assignee_id,department_id,due_date,completed_at,created_at').eq('status','completed').gte('completed_at',from).lt('completed_at',to);
    if(archiveDepartment!=='all')query=query.eq('department_id',archiveDepartment);
    const {data,error}=await query.order('completed_at',{ascending:false}).order('id',{ascending:true})
    .range(offset,offset+pageSize-1);
   if(error)throw error;
   if(serial!==archiveLoadSerial)return;
   const batch=data||[];
   for(const t of batch){
    const day=new Date(t.completed_at).toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});
    counts[day]=(counts[day]||0)+1;
    if(preview.length<1000)preview.push(t);
   }
   total+=batch.length;
   if(batch.length<pageSize){finished=true;break;}
  }
  if(serial!==archiveLoadSerial)return;
  archiveDayCounts=counts;
  archiveRows=preview;
  archiveTruncated=total>preview.length;
  if(!finished)archiveError='한 달의 완료 업무가 20,000건 이상일 수 있어 달력 집계가 중단됐습니다. CSV 내보내기도 기간을 나누어 사용해 주세요.';
 }catch(e){if(serial===archiveLoadSerial)archiveError=String(e.message||e)}
 finally{if(serial===archiveLoadSerial){archiveLoading=false;if(view==='archive')dashboard()}}
}
// V6.6.7.2: Download completed-task records for Excel 2021.
// UTF-8 BOM and comma-separated quoted cells preserve Korean text and line breaks.
// Month AND day exports both fetch matching records directly with pagination.
let archiveExportBusy=false;
async function exportCompletedTasksCsv(mode="month"){
 if(archiveExportBusy)return;
 if(archiveLoading)return alert('조회가 끝난 뒤 내보내기 해 주세요.');
 const selectedMonth=archiveMonth,selectedDay=mode==='day'?archiveDay:'',selectedDepartment=archiveDepartment;
 if(mode==='day'&&!selectedDay)return alert('달력에서 날짜를 먼저 선택해 주세요.');
 archiveExportBusy=true;
 const buttons=[...shell.querySelectorAll('[data-srv-archive-export]')];
 buttons.forEach(b=>{b.disabled=true;b.textContent='CSV 준비 중...';});
 const button=buttons.find(b=>b.dataset.srvArchiveExport===mode);
 try{
  // V6.6.7.2: Both month and day exports query the database directly.
  // This does not depend on the calendar's 1,000-row preview limit.
  let chosen=[];
  const [first,last]=archiveDates(selectedMonth);
  const rangeStart=selectedDay||first;
  const nextDay=selectedDay ? new Date(Date.parse(selectedDay+'T00:00:00Z')+86400000).toISOString().slice(0,10) : last;
  if(selectedDay && !/^\d{4}-\d{2}-\d{2}$/.test(selectedDay))throw new Error('선택한 날짜가 올바르지 않습니다.');
  const from=new Date(rangeStart+'T00:00:00+09:00').toISOString();
  const to=new Date(nextDay+'T00:00:00+09:00').toISOString();
  const pageSize=500,maxRows=20000;
  let finished=false;
  for(let offset=0;offset<=maxRows;offset+=pageSize){
    let query=supa.from('jb_tasks').select('id,title,description,status,assignee_id,department_id,due_date,completed_at,created_at').eq('status','completed').gte('completed_at',from).lt('completed_at',to);
    if(selectedDepartment!=='all')query=query.eq('department_id',selectedDepartment);
    const {data,error}=await query.order('completed_at',{ascending:false}).order('id',{ascending:true})
      .range(offset,offset+pageSize-1);
    if(error)throw error;
    const batch=data||[];
    chosen.push(...batch);
    if(button)button.textContent=`CSV 준비 중... ${chosen.length}건`;
    if(batch.length<pageSize){finished=true;break;}
  }
  if(!finished||chosen.length>maxRows)throw new Error('완료 업무가 20,000건을 초과합니다. 조회 기간을 나누어 내려받아 주세요.');
  if(!chosen.length)return alert('내보낼 완료 업무가 없습니다.');
  const headers=['완료일','완료시각','업무명','업무내용','담당자','부서','목표일','업무ID'];
  const safeCsvValue=v=>{
   let x=String(v==null?'':v);
   if(/^\s*[=+@\-\t\r]/.test(x))x="'"+x;
   return '"'+x.replace(/"/g,'""')+'"';
  };
  const rows=chosen.map(t=>{
   const finished=new Date(t.completed_at);
   const day=finished.toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});
   const timestamp=finished.toLocaleString('ko-KR',{timeZone:'Asia/Seoul',hour12:false});
   const employee=records.employees.find(e=>e.id===t.assignee_id);
   const department=records.departments.find(d=>d.id===(t.department_id||employee?.department_id));
   return [day,timestamp,t.title,t.description||'',employee?.name||'직원명 확인 불가',department?.name||'부서 확인 불가',t.due_date||'',t.id];
  });
  const csv='\ufeff'+[headers,...rows].map(r=>r.map(safeCsvValue).join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  const a=document.createElement('a');a.href=url;a.download=`JB_Completed_Tasks_${selectedDay||selectedMonth}.csv`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
  alert(`${selectedDay?'선택한 날짜':'선택한 월'} 완료 업무 ${chosen.length}건의 CSV 다운로드를 요청했습니다. 브라우저 다운로드 목록을 확인하세요.`);
 }catch(e){alert('완료 업무 CSV 저장 실패: '+String(e.message||e));}
 finally{archiveExportBusy=false; shell.querySelectorAll('[data-srv-archive-export]').forEach(b=>{b.disabled=!!archiveLoading||(b.dataset.srvArchiveExport==='day'&&!archiveDay);b.textContent=b.dataset.srvArchiveExport==='month'?'⬇ 월 전체 CSV 저장':'⬇ 선택 날짜 CSV 저장';});}
}

function jbPushSupported(){return location.protocol==='https:'&&'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;}
async function jbPushEnable(){
 const status=document.getElementById('jbPushStatus');
 const say=t=>{if(status)status.textContent=t;};
 try{
  if(!jbPushSupported())throw Error('휴대폰 푸시는 HTTPS로 배포한 주소에서만 등록할 수 있습니다. 다운로드 HTML은 푸시 지원 대상이 아닙니다.');
  if(!profile||!supa)throw Error('로그인 후 다시 시도해 주세요.');
  const key=String((await jbGetVapidKey())||document.getElementById('jbVapidPublic')?.value||localStorage.getItem('jb_push_vapid_public')||'').trim();
  if(!key)throw Error('서버의 VAPID 공개키가 설정되지 않았습니다. 관리자에게 문의하세요.');
  localStorage.setItem('jb_push_vapid_public',key);
  const permission=await Notification.requestPermission();
  if(permission!=='granted')throw Error('휴대폰 알림 권한이 허용되지 않았습니다. 브라우저 및 휴대폰 알림 설정을 확인하세요.');
  throw new Error('로컬 JB-DEV 미리보기에서는 웹 푸시를 사용할 수 없습니다.');
 const reg=await navigator.serviceWorker.ready;
  await navigator.serviceWorker.ready;
  let subscription=await reg.pushManager.getSubscription();
  if(!subscription){const bytes=Uint8Array.from(atob(key.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(key.length/4)*4,'=')),c=>c.charCodeAt(0));subscription=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:bytes});}
  const saveSubscription=async sub=>{
   const j=sub.toJSON();
   if(!j.endpoint||!j.keys?.p256dh||!j.keys?.auth)throw Error('푸시 구독 키를 읽지 못했습니다.');
   return supa.from('jb_push_subscriptions').upsert({employee_id:profile.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth_secret:j.keys.auth,user_agent:navigator.userAgent,updated_at:new Date().toISOString()},{onConflict:'endpoint'});
  };
  let saveResult=await saveSubscription(subscription);
  if(saveResult.error&&/row-level security|42501/i.test(String(saveResult.error.message||'')+' '+String(saveResult.error.code||''))){
   // This browser may still have a subscription owned by a previously signed-in employee.
   // Never transfer another employee's database row or relax RLS.
   say('이전 계정의 기기 구독을 브라우저에서 해제하고 새로 등록합니다...');
   const removed=await subscription.unsubscribe();
   if(!removed)throw Error('이전 구독을 해제하지 못했습니다. 브라우저 알림 설정을 확인해 주세요.');
   const bytes=Uint8Array.from(atob(key.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(key.length/4)*4,'=')),c=>c.charCodeAt(0));
   subscription=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:bytes});
   saveResult=await saveSubscription(subscription);
  }
  if(saveResult.error)throw saveResult.error;
  say('현재 로그인한 계정의 휴대폰 푸시 등록 완료.');

async function jbMealRegularManage(id,deactivate){
 if(!['owner','manager','staff'].includes(profile?.app_role))return;

 const existing=id?jbMealRegularPeople.find(x=>x.id===id):null;
 if(id&&!existing)return;
 if(deactivate&&profile.app_role==='staff'){alert('고정 인원 비활성화는 관리자에게 요청해 주세요.');return;}
 if(deactivate&&!confirm('고정 식사 명단에서 비활성화할까요? 이미 저장된 과거 신청 내역은 유지됩니다.'))return;
 const name=existing?.display_name||shell.querySelector('#meal-regular-name')?.value.trim()||'';
 const place=existing?.default_location||shell.querySelector('#meal-regular-place-default')?.value||'농원';
 const lunch=existing?.default_lunch??!!shell.querySelector('#meal-regular-lunch-default')?.checked;
 const dinner=existing?.default_dinner??!!shell.querySelector('#meal-regular-dinner-default')?.checked;
 if(!name||name.length>80){alert('고정 인원 이름을 1~80자로 입력하세요.');return}
 try{
  const {error}=profile.app_role==='staff'
   ?await supa.rpc('jb_meal_regular_add_staff_v13',{p_department:jbMealV14Dept,p_name:name,p_place:place,p_lunch:lunch,p_dinner:dinner})
   :await supa.rpc('jb_meal_regular_manage_v15',{p_id:id||null,p_department:jbMealV14Dept,p_name:name,p_place:place,p_lunch:lunch,p_dinner:dinner,p_active:!deactivate});
  if(error)throw error;
  await jbMealV14Load();
  jbMealRegularMessage=deactivate?'고정 인원을 비활성화했습니다.':'고정 식사 인원을 등록했습니다.';
  dashboard();
 }catch(e){jbMealV14Error='고정 명단 관리 실패: '+String(e.message||e);dashboard()}
}
async function jbMealRegularCopyYesterday(){
 if(!jbMealV14WarnDirty())return;
 const d=new Date(jbMealV14Date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-1);
 const previous=d.toISOString().slice(0,10);
 const response=await supa.from('jb_meal_regular_orders_v15').select('regular_id,location').eq('meal_date',previous).eq('meal_type',jbMealV14Type);
 if(response.error){jbMealV14Error='전날 고정 인원 조회 실패: '+response.error.message;dashboard();return}
 const list=response.data||[];
 const eligible=jbMealRegularPeople.filter(x=>x.active&&x.department_id===jbMealV14Dept);
 if(!eligible.some(x=>list.some(r=>r.regular_id===x.id))){jbMealV14Error='전날 저장된 고정 인원 신청이 없습니다.';dashboard();return}
 jbMealRegularDraft={};
 for(const e of eligible){
  const r=list.find(x=>x.regular_id===e.id);
  jbMealRegularDraft[e.id]={eating:!!r,location:r?.location||e.default_location||'농원'};
 }
 jbMealRegularDirty=true;jbMealV14Error='전날 고정 인원 명단을 불러왔습니다. 저장 버튼을 눌러 확정하세요.';dashboard();
}


async function jbMealCutoffSave(){
 if(!['owner','manager'].includes(profile?.app_role)||jbMealCutoffSaving)return;
 const input=shell.querySelector('#meal-cutoff-time');
 const proposed=String(input?.value||'');
 if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(proposed)){
  alert('마감시간을 00:00~23:59 형식으로 선택하세요.');return;
 }
 if(proposed===jbMealV14Settings){jbMealCutoffMessage='현재 설정된 마감시간과 동일합니다.';dashboard();return}
 if(!confirm('전체 부서의 저녁 신청 마감시간을 '+proposed+'(으)로 변경할까요?'))return;
 jbMealCutoffSaving=true;jbMealCutoffMessage='';dashboard();
 try{
  const {data,error}=await supa.rpc('jb_meal_set_deadline_v15',{p_deadline:proposed});
  if(error)throw error;
  const {data:setting,error:readError}=await supa.from('jb_meal_settings').select('dinner_deadline').eq('id',true).single();
  if(readError)throw readError;
  const confirmed=String(setting?.dinner_deadline||'').slice(0,5);
  if(confirmed!==proposed)throw new Error('저장 결과와 서버의 마감시간이 일치하지 않습니다.');
  jbMealV14Settings=confirmed;
  jbMealCutoffMessage='마감시간이 '+confirmed+'(으)로 저장되었습니다. 모든 부서에 공통 적용됩니다.';
 }catch(e){
  jbMealV14Error='저녁 마감시간 변경 실패: '+String(e.message||e);
 }finally{jbMealCutoffSaving=false;if(view==='meals')dashboard()}
}

 if(view==='employees'&&profile?.app_role==='owner'){
  const resetButton=shell.querySelector('#jbOwnerResetButton');
  if(resetButton)resetButton.onclick=async()=>{
    const note=shell.querySelector('#jbOwnerResetMessage');
    const backed=!!shell.querySelector('#jbResetBackup')?.checked;
    const phrase=shell.querySelector('#jbResetPhrase')?.value.trim();
    if(!backed||phrase!=='운영기록 전체 초기화'){
      note.textContent='백업 확인을 체크하고 확인 문구를 정확히 입력하세요.';return;
    }
    if(!confirm('최종 확인: 업무·휴무·근태·공지·알림 등 운영 기록 전체를 영구 초기화합니다. 직원과 계정은 보존됩니다. 계속하시겠습니까?'))return;
    resetButton.disabled=true;
    jbOwnerResetStatus='서버 초기화 요청 중…';note.textContent=jbOwnerResetStatus;
    let resetResult;
    try{
      const {data,error}=await supa.rpc('jb_owner_reset_operations_v11',{
        p_phrase:phrase,p_backup_confirmed:backed
      });
      if(error)throw error;
      resetResult=data;
    }catch(error){
      jbOwnerResetStatus='초기화 요청 실패 또는 응답 확인 오류: '+String(error?.message||error)+'. 실행 여부가 불확실할 수 있으니 다시 누르기 전에 업무 기록을 확인해 주세요.';
      note.textContent=jbOwnerResetStatus;
      resetButton.disabled=false;
      return;
    }
    if(resetResult?.success!==true){
      jbOwnerResetStatus='서버에서 초기화 완료 여부를 확인할 수 없습니다. 중복 실행하지 말고 서버 기록을 확인하세요.';
      note.textContent=jbOwnerResetStatus;
      return;
    }
    const resetCount=Number(resetResult.reset_table_count);
    const preservedCount=Number(resetResult.preserved_table_count);
    const countValid=Number.isInteger(resetCount)&&resetCount===21&&Number.isInteger(preservedCount)&&preservedCount===8;
    jbOwnerResetStatus=countValid
      ?'서버에서 운영 기록 21개 테이블 초기화와 보존 대상 8개 확인 응답을 받았습니다. 목록을 다시 조회합니다.'
      :'초기화 완료 응답을 받았지만 대상 범위가 예상(21개 초기화·8개 보존)과 다릅니다. 재실행하지 말고 서버 범위를 확인하세요.';
    note.textContent=jbOwnerResetStatus;
    try{
      await loadData();
      if(err)jbOwnerResetStatus+=' 화면 자료 재조회 오류: '+String(err);
      else if(countValid)jbOwnerResetStatus='운영 기록 21개 테이블 초기화 응답 확인 완료. 직원·부서 등 보존 기록은 유지되며 서버 목록을 다시 조회했습니다.';
    }catch(readError){
      jbOwnerResetStatus+=' 목록 재조회에 실패했습니다: '+String(readError?.message||readError)+'. 초기화를 다시 실행하지 마세요.';
    }
    dashboard();
  };
 }

// 모바일 사진 촬영: 기존 사진 업로드 input으로 촬영 파일을 합쳐 전달합니다.
function jbOpenCamera(button, targetName) {
  const scope = button.closest('form') || document;
  const target = targetName === 'task_photo'
    ? scope.querySelector('input[type="file"]')
    : (scope.querySelector('[name="'+targetName+'"]') || document.getElementById(targetName));
  if (!target) return alert('사진 첨부 입력란을 찾을 수 없습니다.');
  const camera = document.createElement('input');
  camera.type = 'file';
  camera.accept = 'image/*';
  camera.setAttribute('capture', 'environment');
  camera.style.display = 'none';
  scope.appendChild(camera);
  camera.addEventListener('change', () => {
    try {
      if (camera.files && camera.files.length) {
        const transfer = new DataTransfer();
        if (target.multiple) for (const file of target.files) transfer.items.add(file);
        for (const file of camera.files) transfer.items.add(file);
        target.files = transfer.files;
        target.dispatchEvent(new Event('change', {bubbles:true}));
      }
    } catch(e) { alert('촬영 사진을 첨부하지 못했습니다. 사진 선택을 이용해 주세요.'); }
    camera.remove();
  }, {once:true});
  camera.click();
}
</script>
